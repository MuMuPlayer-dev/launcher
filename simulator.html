<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUMUPlayer</title>
<link rel="icon" href="https://images.dwncdn.net/images/t_app-icon-l/p/d520014e-daf4-451a-8a8c-9aacc33f4d25/2693453914/mumuplayer-1-logo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#060a17;color:#fff;cursor:default;font-family:'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,Arial,sans-serif;user-select:none;-webkit-user-select:none}
body{cursor:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='26'%20height='26'%20viewBox='0%200%2026%2026'%3E%3Cpath%20d='M3%202.5%20L3%2019.5%20L15.5%2011%20Z'%20fill='%23ffffff'%20stroke='%23000000'%20stroke-width='1.7'%20stroke-linejoin='round'/%3E%3Ccircle%20cx='11.3'%20cy='15.3'%20r='2.4'%20fill='%234aa3e8'%20stroke='%23000000'%20stroke-width='1.3'/%3E%3C/svg%3E") 3 3, auto}
button,input,a,[role="button"],label{cursor:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus{outline:none}
button:focus-visible{outline:2px solid rgba(255,255,255,.5);outline-offset:3px;border-radius:14px}
input{user-select:text;-webkit-user-select:text;caret-color:#A5C2FF}

#wall{position:fixed;inset:0;z-index:0;display:block}
#ui{position:fixed;top:0;left:0;width:calc(100% / var(--s,1));height:calc(100% / var(--s,1));z-index:1;opacity:0;transform:scale(var(--s,1));transform-origin:0 0;transition:opacity .7s var(--ease),transform .16s ease-out}
#ui.ready{opacity:1}

#statusbar{position:absolute;top:0;left:0;right:0;height:42px;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:15px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5);transition:background .25s ease}
#statusbar.appbg{background:#000}
.sb-right{display:flex;align-items:center;gap:12px}
.sb-pair{display:flex;align-items:center;gap:6px}
.sb-right svg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}

/* ---------- home: pager (side grids peek without intersecting) ---------- */
#pagerwrap{position:absolute;left:0;right:0;top:48px;bottom:134px;overflow:hidden;z-index:1;touch-action:none}
#pager{height:100%;transform-origin:8% 50%;transition:transform .3s var(--ease)}
#pager.editing{transform:scale(.78)}
#pagetrack{display:flex;height:100%;will-change:transform;transition:transform .3s var(--ease)}
.page{flex:0 0 100%;height:100%;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr);min-width:0}
#pager.editing .page{outline:2.5px solid rgba(135,198,255,.75);outline-offset:7px;border-radius:20px;background:rgba(135,198,255,.10)}
#pager.editing .page + .page{margin-left:4%}
.cell{position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
.cell.drop::after{content:"";position:absolute;inset:9%;border-radius:16px;border:2.5px solid rgba(135,198,255,.9);background:rgba(135,198,255,.16);pointer-events:none}
.cell.mh .ic::before{content:"";position:absolute;inset:-11px;border-radius:20px;background:rgba(158,162,170,.38);animation:mhIn .2s var(--ease) both}
@keyframes mhIn{from{transform:scale(.72);opacity:0}}
.app{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px}
.app .ic{position:relative;width:66px;height:66px;transition:transform .16s var(--ease)}
.app .ic>svg:not(.dl-ov){position:relative;z-index:1;width:100%;height:100%;display:block}
.app:active .ic{transform:scale(.88)}
.app .lb{font-size:13px;font-weight:500;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#46d67f;margin-right:5px}
.dl-cell .ic>svg:not(.dl-ov){filter:brightness(.42)}
svg.dl-ov{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3}
svg.dl-ov.zoom{transition:transform .32s ease,opacity .3s ease;transform:scale(1.55);opacity:0}
#pagedots{position:absolute;left:0;right:0;bottom:114px;display:flex;justify-content:center;opacity:0;transition:opacity .35s;pointer-events:none;z-index:3}
#pagedots.show{opacity:1}
.dotsin{position:relative;height:7px}
.dotsin .d{position:absolute;top:0;width:7px;height:7px;border-radius:99px;background:#6d747d}
.dotsin .d.on{background:#d9dde2}
.dotsin .pill{position:absolute;top:0;height:7px;width:7px;border-radius:99px;background:#d9dde2;opacity:0;transition:left .2s ease,width .2s ease}
#dock{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);display:flex;gap:18px}
.dcell{width:78px;height:72px}
#dock .app{gap:0}
#dock .app .lb{display:none}
#gest{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);width:118px;height:4px;border-radius:99px;background:rgba(255,255,255,.55)}
.ghost{position:fixed;z-index:99;pointer-events:none;width:72px;height:72px;transform:translate(-50%,-58%);filter:drop-shadow(0 16px 30px rgba(0,0,0,.55))}
.ghost svg{width:100%;height:100%;display:block}

/* ---------- folder overlay ---------- */
.foldov{position:fixed;inset:0;z-index:40}
.foldbg{position:absolute;inset:0;background:rgba(4,6,12,.45);opacity:0;transition:opacity .25s}
.foldov.open .foldbg{opacity:1}
.foldbox{position:fixed;background:#3a3d43;border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.5);overflow:hidden;transition:left .32s var(--ease),top .32s var(--ease),width .32s var(--ease),height .32s var(--ease)}
.foldgrid{position:absolute;left:10px;right:10px;top:10px;bottom:52px;overflow:hidden;opacity:0;transition:opacity .2s .12s;touch-action:none}
.foldov.open .foldgrid{opacity:1}
.foldtrack{display:flex;height:100%;will-change:transform;transition:transform .28s var(--ease)}
.foldpage{flex:0 0 100%;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(2,1fr);min-width:0}
.fslot{display:flex;align-items:center;justify-content:center;min-width:0;border-radius:12px}
.fslot.fdrop{box-shadow:inset 0 0 0 2px rgba(135,198,255,.85)}
.foldapp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.foldapp .ic{position:relative;width:58px;height:58px}
.foldapp .ic>svg{width:100%;height:100%;display:block}
.foldapp .lb{font-size:12px;font-weight:500;color:#fff;max-width:100px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.foldname{position:absolute;left:12px;bottom:10px;color:#fff;font-size:13.5px;font-weight:600;padding:5px 9px;border-radius:8px;max-width:55%;white-space:nowrap;overflow:hidden}
.foldname:hover{background:rgba(255,255,255,.14)}
.foldname-in{width:150px;height:28px;border-radius:8px;background:rgba(255,255,255,.12);border:1.5px solid #8cb4f9;color:#fff;font:inherit;font-size:13px;padding:0 10px;outline:0}
.folddots{position:absolute;right:14px;bottom:17px;display:flex;gap:6px}
.folddots span{width:7px;height:7px;border-radius:99px;background:#6d747d}
.folddots span.on{background:#d9dde2}

#appview{position:absolute;left:0;right:0;top:42px;bottom:0;z-index:2}
#appview[hidden]{display:none}
.avbox{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:avIn .45s var(--ease) both}
@keyframes avIn{from{opacity:0;transform:translateY(12px)}}
.avic{width:92px;height:92px;filter:drop-shadow(0 10px 26px rgba(0,0,0,.5))}
.avic svg{width:100%;height:100%;display:block}
.avname{font-size:24px;font-weight:600;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.avsub{font-size:13px;color:#a9b0ba;margin-top:-4px}
.appembed{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.appanim{position:fixed;inset:0;z-index:6;background:#0a0c12;display:flex;align-items:center;justify-content:center;transition:clip-path .38s var(--ease),opacity .35s ease}
.appanim.fade{opacity:0}
.aa-ic{width:118px;height:118px;transition:transform .38s var(--ease)}
.aa-ic svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 30px rgba(0,0,0,.55))}

#splash{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;transition:opacity .65s ease}
#splash.hide{opacity:0;pointer-events:none}
.spl-card{display:flex;flex-direction:column;align-items:center;gap:22px;padding:54px 88px;border-radius:30px;background:rgba(6,11,25,.38);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(16px) saturate(1.15);animation:splIn .8s var(--ease) both}
@keyframes splIn{from{opacity:0;transform:scale(.93) translateY(12px)}}
.spl-logo{width:98px;height:98px;border-radius:24px;display:block;user-select:none;-webkit-user-drag:none}
.spl-name{font-size:46px;font-weight:600;letter-spacing:.015em;color:#fff;text-shadow:0 2px 18px rgba(90,150,220,.35)}
#bootbar{position:fixed;left:0;right:0;bottom:0;height:34px;z-index:6;background:rgba(14,16,22,.55);backdrop-filter:blur(6px);transition:opacity .55s ease}
#bootbar.hide{opacity:0}
.bb-line{position:absolute;top:0;left:0;height:3px;width:0%;background:linear-gradient(90deg,#2b6fe0,#54d0e1)}
.bb-dot{position:absolute;right:-4px;top:1.5px;transform:translateY(-50%);width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 10px 2px rgba(90,170,255,.85),0 0 3px 1px rgba(120,190,255,.9)}
.bb-pct{position:absolute;right:16px;bottom:8px;font-size:12px;font-weight:600;color:#5db4e8;font-variant-numeric:tabular-nums}
#caretdrop{position:fixed;z-index:999;pointer-events:none;opacity:0}

/* ============ CHROMIUM ============ */
.chromium{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--cA);animation:avIn .4s var(--ease) both;
  --cA:#0e0f12;--cB:#121317;--cS:#191b21;--cAdr:#282e38;--cAdrT:#c7ccd4;--cCnt:#1c1d21;--cNts:#474b52;
  --cTm:#030305;--cBox:#272e37;--cPop:#2c323f;--cDlg:#20262e;--cSnk:#2b2d33;--cBm:#1d1f24;
  --cT1:#e8eaee;--cT2:#b9bdc3;--cT3:#cfd4da;--cT4:#8f939b;--cT5:#d6dade;--hov:rgba(255,255,255,.09)}
.chromium.light{--cA:#f1f0ed;--cB:#edebe8;--cS:#e6e4de;--cAdr:#d7d1c7;--cAdrT:#38332b;--cCnt:#e3e2de;--cNts:#b8b4ad;
  --cTm:#fcfcfa;--cBox:#d8d1c8;--cPop:#d3cdc0;--cDlg:#dfd9d1;--cSnk:#d4d2cc;--cBm:#e2e0db;
  --cT1:#17151f;--cT2:#46423c;--cT3:#302b25;--cT4:#706c64;--cT5:#292521;--hov:rgba(0,0,0,.08)}
.chromium.incognito{--cA:#000;--cB:#060607;--cS:#0e0e10;--cAdr:#101114;--cCnt:#000;--cNts:#1c1c20;
  --cTm:#000;--cBox:#131315;--cPop:#17171a;--cDlg:#121214;--cSnk:#151517;--cBm:#0b0b0d;
  --cT1:#e8eaee;--cT2:#b9bdc3;--cT3:#cfd4da;--cT4:#8f939b;--cT5:#d6dade;--hov:rgba(255,255,255,.10)}
.ch-strip{height:40px;flex:none;display:flex;align-items:stretch;padding:0 6px;background:var(--cA)}
.ch-tabs{display:flex;align-items:stretch;flex:0 1 auto;min-width:0;overflow:hidden;padding:0 10px}
.ch-new{align-self:center;width:30px;height:28px;margin-left:2px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--cT2);transition:background .13s,color .13s;flex:none}
.ch-new:hover{background:var(--hov);color:var(--cT1)}
.ch-new svg{width:13px;height:13px}
.ch-tab{position:relative;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;margin-right:12px;border-radius:10px 10px 0 0;font-size:12.5px;font-weight:600;color:var(--cT2);white-space:nowrap;min-width:56px;flex:none;background:var(--cB);overflow:hidden}
.ch-tab.sel{background:var(--cS);color:var(--cT1)}
.ch-tab .hv{position:absolute;left:5px;right:5px;top:5px;bottom:5px;border-radius:7px;background:var(--hov);opacity:0;transition:opacity .15s;pointer-events:none}
.ch-tab:not(.sel):hover .hv{opacity:1}
.ch-tab>*:not(.hv){position:relative}
.ch-tab.sel::before{content:"";position:absolute;left:-10px;bottom:0;width:10px;height:10px;background:radial-gradient(circle 10px at 0% 0%, rgba(0,0,0,0) 9.4px, var(--cS) 9.5px)}
.ch-tab.sel::after{content:"";position:absolute;right:-10px;bottom:0;width:10px;height:10px;background:radial-gradient(circle 10px at 100% 0%, rgba(0,0,0,0) 9.4px, var(--cS) 9.5px)}
.ch-tab:not(.sel)::before{content:"";position:absolute;left:-10px;bottom:0;width:10px;height:10px;background:radial-gradient(circle 10px at 0% 0%, rgba(0,0,0,0) 9.4px, var(--cB) 9.5px)}
.ch-tab:not(.sel)::after{content:"";position:absolute;right:-10px;bottom:0;width:10px;height:10px;background:radial-gradient(circle 10px at 100% 0%, rgba(0,0,0,0) 9.4px, var(--cB) 9.5px)}
.ch-tab.in{animation:chTabIn .34s var(--ease) both}
.ch-tab.out{animation:chTabOut .19s ease both}
@keyframes chTabIn{from{opacity:0;transform:translateY(38px)}}
@keyframes chTabOut{to{opacity:0;transform:translateY(38px)}}
.ch-tic{position:relative;width:16px;height:16px;flex:none;color:var(--cT4)}
.ch-tab.sel .ch-tic{color:var(--cT3)}
.ch-tic svg{position:absolute;inset:0;width:100%;height:100%}
.ch-fav{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ch-tname{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;display:block}
.ch-tname.ov{mask-image:linear-gradient(90deg,#000 70%,transparent 100%);-webkit-mask-image:linear-gradient(90deg,#000 70%,transparent 100%)}
.ch-tx{width:18px;height:18px;flex:none;border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--cT2);opacity:.65;transition:background .12s,color .12s,opacity .12s}
.ch-tx:hover{background:#d5432f;color:#fff;opacity:1}
.ch-tx svg{width:8px;height:8px}
.ch-bar{height:54px;flex:none;background:var(--cS);display:flex;align-items:center;gap:3px;padding:0 10px}
.ch-btn{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--cT1);transition:background .13s}
.ch-btn:hover{background:var(--hov)}
.ch-btn svg{width:19px;height:19px;display:block}
.ch-btn.dis{color:var(--cT4);pointer-events:none}
.ch-addr{flex:1;min-width:0;height:38px;background:var(--cAdr);border-radius:999px;display:flex;align-items:center;gap:7px;padding:0 6px 0 12px;color:var(--cAdrT);margin-left:5px}
.ch-addr-ic{width:16px;height:16px;flex:none;display:flex;align-items:center;justify-content:center}
.ch-addr-ic svg{width:12px;height:14px}
.ch-addr-ic img{width:14px;height:14px;object-fit:contain;display:block}
.ch-addr-in{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--cAdrT);font:400 13px/1 'Roboto',sans-serif}
.ch-addr-in::selection{background:rgba(90,170,255,.35)}
.ch-addrbtn{width:30px;height:30px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--cAdrT);transition:background .12s,color .12s}
.ch-addrbtn:hover{background:var(--hov);color:var(--cT1)}
.ch-addrbtn svg{width:16px;height:16px}
.ch-star svg path{fill:none}
.ch-star.marked svg path{fill:currentColor}
.ch-count{width:32px;height:32px;flex:none;border-radius:9px;border:1.7px solid var(--cT3);color:var(--cT3);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;transition:background .12s}
.ch-count:hover{background:var(--hov)}
.ch-bmbar{height:34px;flex:none;display:none;align-items:center;gap:4px;padding:0 10px;background:var(--cBm);overflow-x:auto;scrollbar-width:none}
.ch-bmbar::-webkit-scrollbar{display:none}
.bm{display:flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:7px;color:var(--cAdrT);font-size:12.5px;font-weight:600;max-width:190px;white-space:nowrap;overflow:hidden;flex:none;transition:background .13s,color .13s}
.bm:hover{background:var(--hov);color:var(--cT1)}
.bm img{width:14px;height:14px;flex:none;object-fit:contain}
.ch-content{flex:1;position:relative;background:var(--cCnt)}
.ch-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.ch-blankk{position:absolute;inset:0;background:#000}
.ch-nt{position:absolute;inset:0;background:var(--cCnt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.nt-logo{width:220px;max-width:64%;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}
.nt-search{width:560px;max-width:84%;height:46px;border-radius:999px;background:var(--cNts);display:flex;align-items:center;gap:14px;padding:0 20px;color:#fff}
.nt-search svg{width:17px;height:17px;flex:none}
.nt-search span{font-size:14px;color:var(--cT4);text-align:left;flex:1}
.ch-ntm{position:absolute;inset:0;z-index:5;background:var(--cCnt);display:flex;flex-direction:column;animation:avIn .25s ease both}
.ntm-top{display:flex;align-items:center;gap:12px;padding:16px 18px 12px}
.ntm-back{width:34px;height:34px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#4a8fe8;transition:background .13s}
.ntm-back:hover{background:rgba(74,143,232,.14)}
.ntm-back svg{width:20px;height:20px}
.ntm-in{flex:1;height:44px;border-radius:999px;background:var(--cNts);border:0;outline:0;color:var(--cT1);font:400 14.5px/1 'Roboto',sans-serif;padding:0 20px}
.ntm-in::selection{background:rgba(90,170,255,.35)}
.ntm-line{height:1px;background:var(--cT4);opacity:.55;margin:0 18px}
.ch-fb{position:absolute;inset:0;background:var(--cCnt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--cT2);padding:20px;text-align:center}
.fb-globe{width:54px;height:54px;color:var(--cT4)}
.fb-globe svg{width:100%;height:100%}
.fb-host{font-size:17px;font-weight:600;color:var(--cT1)}
.fb-msg{font-size:13.5px;max-width:420px;line-height:1.6}
.fb-open{margin-top:10px;height:38px;padding:0 22px;border-radius:999px;background:var(--cNts);color:var(--cT1);font-size:13.5px;font-weight:600;display:flex;align-items:center;text-decoration:none;transition:background .15s}
.fb-open:hover{filter:brightness(1.15)}
.ch-hist{position:absolute;inset:0;overflow-y:auto;background:var(--cCnt);color:var(--cT1)}
.ch-hist-in{max-width:560px;margin:0 auto;padding:30px 18px 40px}
.ch-hist h2{font-size:22px;font-weight:600;margin-bottom:18px}
.hh{display:grid;grid-template-columns:20px 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;width:100%;text-align:left;padding:10px 8px;border-radius:10px}
.hh:hover{background:var(--hov)}
.hh img{grid-row:1/3;width:16px;height:16px;object-fit:contain}
.hh-n{color:var(--cT1);font-size:14px;font-weight:600}
.hh-u{font-size:12.5px;color:var(--cT4)}
.hh-empty{color:var(--cT4);font-size:14px}
.ch-tabsmenu{position:absolute;inset:0;z-index:50;background:var(--cTm);display:flex;flex-direction:column;animation:avIn .22s ease both}
.tm-head{flex:none;display:flex;align-items:center;gap:6px;padding:14px 24px}
.tm-new{display:flex;align-items:center;gap:9px;height:38px;padding:0 16px 0 13px;border-radius:10px;color:var(--cT5);font-size:13.5px;font-weight:600;transition:background .13s}
.tm-new:hover{background:var(--hov)}
.tm-new svg{width:16px;height:16px;flex:none}
.tm-mode{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--cT3);transition:background .13s,color .13s}
.tm-mode:hover{background:var(--hov)}
.tm-mode.on{color:#8cb4f9}
.tm-mode svg{width:18px;height:18px}
.tm-mode:first-of-type{margin-left:auto}

const cv = $('#wall'), cx = cv.getContext('2d');
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function paintWall(g, W, H){
  const m = Math.min(W, H);
  const rnd = mulberry32(0x4D554D21);
  const star = (x, y, s, a) => {
    const gr = g.createRadialGradient(x, y, 0, x, y, s * 4.5);
    gr.addColorStop(0, 'rgba(165,195,255,' + (0.55 * a).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(120,160,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, s * 4.5, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
    g.beginPath(); g.arc(x, y, s, 0, 7); g.fill();
  };
  const crater = (x, y, r, lx, ly, dark, mid, rim) => {
    const la = Math.atan2(ly, lx);
    const gr = g.createRadialGradient(x + lx * r * 0.45, y + ly * r * 0.45, r * 0.1, x, y, r);
    gr.addColorStop(0, rim); gr.addColorStop(.6, mid); gr.addColorStop(1, dark);
    g.fillStyle = gr;
    g.beginPath(); g.ellipse(x, y, r, r * 0.94, 0, 0, 7); g.fill();
    g.lineWidth = Math.max(1, r * 0.16);
    g.strokeStyle = 'rgba(255,255,255,.30)';
    g.beginPath(); g.arc(x, y, r * 0.9, la - 0.85, la + 0.85); g.stroke();
    g.strokeStyle = 'rgba(0,0,25,.22)';
    g.beginPath(); g.arc(x, y, r * 0.9, la + Math.PI - 0.85, la + Math.PI + 0.85); g.stroke();
  };
  const rr = (x, y, w, h, r) => {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  };
  const bg = g.createLinearGradient(0, 0, W * 0.25, H);
  bg.addColorStop(0, '#0b1326'); bg.addColorStop(.55, '#091021'); bg.addColorStop(1, '#060a17');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const n = Math.max(60, Math.round(W * H / 9000));
  for (let i = 0; i < n; i++) star(rnd() * W, rnd() * H, 0.4 + rnd() * rnd() * 1.9, 0.55 + rnd() * 0.45);
  const mr = m * 0.52, mcx = -mr * 0.34, mcy = H + mr * 0.34;

  g.beginPath(); g.arc(mcx, mcy, mr, 0, 7); g.clip();
  const mg = g.createRadialGradient(mcx + mr * 0.55, mcy - mr * 0.55, mr * 0.1, mcx, mcy, mr);
  mg.addColorStop(0, '#eff1f3'); mg.addColorStop(.55, '#d5d9dd'); mg.addColorStop(1, '#b7bdc3');
  g.fillStyle = mg; g.fillRect(mcx - mr, mcy - mr, mr * 2, mr * 2);
  for (let i = 0; i < 9; i++){
    const ang = -(0.3 + rnd() * 1.05), d = mr * (0.28 + rnd() * 0.55);
    crater(mcx + Math.cos(ang) * d, mcy + Math.sin(ang) * d,
           mr * (0.04 + rnd() * 0.085), 0.7, -0.7, '#787e86', '#a6abb1', '#dfe2e5');
  }
  const term = g.createLinearGradient(mcx - mr * 0.8, mcy + mr * 0.8, mcx + mr * 0.6, mcy - mr * 0.6);
  term.addColorStop(0, 'rgba(4,7,20,0.97)'); term.addColorStop(.5, 'rgba(5,9,26,0.55)'); term.addColorStop(1, 'rgba(5,9,26,0)');
  g.fillStyle = term; g.fillRect(mcx - mr, mcy - mr, mr * 2, mr * 2);
  g.restore();
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2.5;
  g.beginPath(); g.arc(mcx, mcy, mr - 1.2, -0.785 - 0.65, -0.785 + 0.65); g.stroke();
  const ROT = 15 * Math.PI / 180;
  const PW = m * 0.085, PL = m * 0.36, gap = m * 0.05;
  const halfW = (PW / 2) * Math.cos(ROT) + (PL / 2) * Math.sin(ROT);
  const groupW = 4 * halfW + 2 * gap + PW;
  const rightX = W * 0.84, leftX = rightX - groupW, bottomY = H * 0.62;
  const circX = rightX - PW / 2, circY = bottomY - PW / 2;
  const pillY = bottomY - PW / 2 - (PL / 2 - PW / 2) * Math.cos(ROT);
  const pillAx = leftX + halfW, pillBx = leftX + 3 * halfW + gap;
  const shape = (kind, px, py) => {
    g.save();
    g.translate(px, py);
    if (kind === 'pill') g.rotate(ROT);
    const R = kind === 'pill' ? PL / 2 : PW / 2;
    const grad = g.createRadialGradient(0, 0, R * 0.08, 0, 0, R);
    grad.addColorStop(0, '#8ed2f3'); grad.addColorStop(.35, '#c4e4f7'); grad.addColorStop(1, '#eff8ff');
    const path = () => { if (kind === 'pill') rr(-PW / 2, -PL / 2, PW, PL, PW / 2); else { g.beginPath(); g.arc(0, 0, PW / 2, 0, 7); } };
    g.shadowColor = 'rgba(125,190,255,.38)'; g.shadowBlur = 64; g.shadowOffsetX = -54;
    g.fillStyle = grad; path(); g.fill();
    g.shadowColor = 'rgba(150,212,255,.62)'; g.shadowBlur = 26; g.shadowOffsetX = -20;
    path(); g.fill();

    g.fillStyle = grad; path(); g.fill();

    path(); g.stroke();
    g.restore();
  };
  shape('pill', pillAx, pillY); shape('pill', pillBx, pillY); shape('circle', circX, circY);
  const pr = m * 0.17, pcx = W - pr * 1.3, pcy = pr * 1.5;
  g.save();
  g.beginPath(); g.arc(pcx, pcy, pr, 0, 7); g.clip();
  const pg = g.createRadialGradient(pcx - pr * 0.5, pcy + pr * 0.5, pr * 0.15, pcx, pcy, pr * 1.05);
  pg.addColorStop(0, '#c8dbdf'); pg.addColorStop(.6, '#a9c4cb'); pg.addColorStop(1, '#8fb0b9');
  g.fillStyle = pg; g.fillRect(pcx - pr, pcy - pr, pr * 2, pr * 2);
  const sh = g.createLinearGradient(pcx + pr * 0.85, pcy - pr * 0.85, pcx - pr * 0.7, pcy + pr * 0.7);
  sh.addColorStop(0, 'rgba(23,62,74,0.85)'); sh.addColorStop(.55, 'rgba(23,62,74,0.35)'); sh.addColorStop(1, 'rgba(23,62,74,0)');
  g.fillStyle = sh; g.fillRect(pcx - pr, pcy - pr, pr * 2, pr * 2);
  for (let i = 0; i < 8; i++){
    const a = rnd() * Math.PI * 2, d = rnd() * pr * 0.72;
    crater(pcx + Math.cos(a) * d, pcy + Math.sin(a) * d, pr * (0.05 + rnd() * 0.08), -0.7, 0.7, '#5d7b85', '#89a4ac', '#d3e6ea');
  }
  g.restore();
  g.strokeStyle = 'rgba(225,248,252,.5)'; g.lineWidth = 1.6;
  g.beginPath(); g.arc(pcx, pcy, pr - 0.8, Math.PI * 0.6, Math.PI * 1.1); g.stroke();

  for (let i = 0; i < 5; i++) star(pcx - pr * 1.05 + rnd() * pr * 2.1, 10 + rnd() * topBand, 0.7 + rnd() * 1.1, 0.9);
}

  dropTO = setTimeout(() => {
    dropEl.style.transition = 'opacity .8s ease';

  clearTimeout(dropTO);

uiEl.addEventListener('pointerdown', e => {

function onPM(e){

    if (Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) && !dnd){
      P.mode = 'swipe';
      swipe = { base: baseX() };
      showDots();
    }
  }
  if (P.mode === 'swipe' && swipe){
    const W = trackW();
    let X = swipe.base + dx;
    const min = -(pages.length - 1) * W;
    if (X > 0) X *= 0.3;
    if (X < min) X = min + (X - min) * 0.3;
    trackEl.style.transition = 'none';

/* ============ folders ============ */
function openFolder(folder, cell){
  if (folderOpen) closeFolder(false);
  const ic = cell ? cell.querySelector('.ic') : null;
  const srcRect = ic ? ic.getBoundingClientRect()
    : { left: innerWidth / 2 - 33, top: innerHeight / 2 - 33, width: 66, height: 66 };

    </div>`;
  document.body.appendChild(ov);
  const box = ov.querySelector('.foldbox');
  const rows = folder.apps.length <= 2 ? 1 : 2;
  const FW = 236, FH = rows * 96 + 52;
  let left = srcRect.left + srcRect.width / 2 - FW / 2;
  let top;
  const row = (cell && cell.dataset.page != null && !cell.dataset.area && !cell.dataset.virtual)
    ? Math.floor(+cell.dataset.idx / 6) : 1;
  if (row === 0) top = srcRect.top;
  else if (row === 2) top = srcRect.bottom - FH;
  else top = srcRect.top + srcRect.height / 2 - FH / 2;
  left = Math.max(10, Math.min(innerWidth - 10 - FW, left));
  top = Math.max(50, Math.min(innerHeight - 10 - FH, top));
  Object.assign(box.style, { left: srcRect.left + 'px', top: srcRect.top + 'px', width: srcRect.width + 'px', height: srcRect.height + 'px' });
  folderOpen = { folder, ov, box, srcRect, page: 0, nPages: 1 };
  buildFolderContent();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    Object.assign(box.style, { left: left + 'px', top: top + 'px', width: FW + 'px', height: FH + 'px' });
    ov.classList.add('open');
  }));

}
function buildFolderContent(){

  if (!chunks.length) chunks.push([]);

        b.querySelector('.lb').textContent = homeName(a);

          if (suppressClick || dnd || fdnd) return;

          closeFolder(false);
          openAppFromRect(a, r);

        w.appendChild(b);

function wireFoldSwipe(){
  const fo = folderOpen; if (!fo) return;
  const grid = fo.ov.querySelector('.foldgrid');

  grid.addEventListener('pointerdown', e => {
    if (e.target.closest('.foldapp') || e.target.closest('.foldname')) return;
    fs = { x0: e.clientX, base: -fo.page * grid.clientWidth };
    try { grid.setPointerCapture(e.pointerId); } catch (err) {}
  });
  grid.addEventListener('pointermove', e => {
    if (!fs || !folderOpen) return;
    const W = grid.clientWidth;
    let X = fs.base + (e.clientX - fs.x0);
    const min = -(fo.nPages - 1) * W;
    if (X > 0) X *= 0.3;
    if (X < min) X = min + (X - min) * 0.3;
    track.style.transition = 'none';
    track.style.transform = `translateX(${X}px)`;
  });
  grid.addEventListener('pointerup', e => {
    if (!fs || !folderOpen) { fs = null; return; }
    const W = grid.clientWidth;

    if (dx < -W * 0.2) tgt++;

function folderAppPD(e, a){

  let started = false, handedOff = false;
  const fd = { app: a, folder: fo.folder, ov: fo.ov, box: fo.box, ghost: null, target: null, inside: true };
  const holdT = setTimeout(() => {
    started = true;
    fdnd = fd;
    suppressClick = true;
    setTimeout(() => suppressClick = false, 450);
    const g = document.createElement('div');
    g.className = 'ghost';
    g.innerHTML = appIconSVG(a);
    g.style.left = sx + 'px'; g.style.top = sy + 'px';
    document.body.appendChild(g);
    fd.ghost = g;
  }, 230);
  const clearFoldHover = () => $$('.fslot.fdrop', fd.ov).forEach(s => s.classList.remove('fdrop'));
  const move = ev => {
    if (!started) {
      if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 9){ clearTimeout(holdT); cleanup(); }
      return;
    }
    if (!fd.inside) return;
    fd.ghost.style.left = ev.clientX + 'px';
    fd.ghost.style.top = ev.clientY + 'px';
    const bx = fd.box.getBoundingClientRect();
    const inBox = ev.clientX > bx.left && ev.clientX < bx.right && ev.clientY > bx.top && ev.clientY < bx.bottom;
    if (!inBox){
      fd.inside = false;
      handedOff = true;
      clearFoldHover();
      dnd = { app: a, src: { kind: 'folder', folder: fd.folder, idx: fd.folder.apps.indexOf(a) }, srcCell: null, ghost: fd.ghost, target: null };
      closeFolder(true);
      enterEdit();
      P = { mode: 'drag', x0: sx, y0: sy, lx: ev.clientX, ly: ev.clientY, t0: performance.now(), cell: null, holdT: 0 };
      addEventListener('pointermove', onPM, true);
      addEventListener('pointerup', onPU, true);
      dragMove(ev);
      return;
    }
    clearFoldHover();
    let hit = null;
    for (const s of fd.ov.querySelectorAll('.fslot')){
      const r = s.getBoundingClientRect();
      if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom){ hit = s; break; }
    }
    fd.target = hit;
    if (hit) hit.classList.add('fdrop');
  };
  const up = () => {
    removeEventListener('pointermove', move, true);
    removeEventListener('pointerup', up, true);
    clearTimeout(holdT);
    if (!started) return;
    if (fd.inside && folderOpen){
      clearFoldHover();
      if (fd.target){
        const slots = [...fd.ov.querySelectorAll('.fslot')];
        const ti = slots.indexOf(fd.target);
        if (ti > -1){
          const arr = fd.folder.apps;
          const from = arr.indexOf(a);
          if (from > -1) arr.splice(from, 1);
          arr.splice(Math.min(ti, arr.length), 0, a);
        }
      }
      if (fd.ghost) fd.ghost.remove();
      fdnd = null;
      persistDev();
      buildFolderContent();
      renderHome();
    } else if (handedOff){
      fdnd = null;
    } else {
      if (fd.ghost) fd.ghost.remove();
      fdnd = null;
    }
  };
  const cleanup = () => {
    removeEventListener('pointermove', move, true);
    removeEventListener('pointerup', up, true);
  };
  addEventListener('pointermove', move, true);
  addEventListener('pointerup', up, true);
}

/* ============ app open animation + view switching ============ */
function openAppFromRect(app, r){
  const ov = document.createElement('div');
  ov.className = 'appanim';
  ov.innerHTML = `<div class="aa-ic">${app.fid ? folderIconSVG(app) : appIconSVG(app)}</div>`;
  document.body.appendChild(ov);
  const ic = ov.querySelector('.aa-ic');
  const t = Math.max(0, r.top), rt = Math.max(0, innerWidth - r.right),
        b = Math.max(0, innerHeight - r.bottom), l = Math.max(0, r.left);
  ov.style.clipPath = `inset(${t}px ${rt}px ${b}px ${l}px round ${Math.min(18, r.width / 3)}px)`;
  const FIN = 118;
  const dx = (r.left + r.width / 2) - innerWidth / 2;
  const dy = (r.top + r.height / 2) - innerHeight / 2;
  ic.style.transform = `translate(${dx}px, ${dy}px) scale(${(r.width / FIN).toFixed(4)})`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    ov.style.clipPath = 'inset(0px round 0px)';
    ic.style.transform = 'none';
  }));
  setTimeout(() => {
    showView(app.id);
    if (window.parent !== window){
      try {
        parent.postMessage({
          type: 'mumu-open', id: DEV && DEV.id,
          app: { id: app.id, name: app.tabName || app.name, icon: app.fid ? folderIconSVG(app) : appIconSVG(app) }
        }, '*');
      } catch (e) {}
    }
  }, 790);
  setTimeout(() => ov.classList.add('fade'), 790);
  setTimeout(() => ov.remove(), 1180);
}
function openApp(app, iconEl){ openAppFromRect(app, iconEl.getBoundingClientRect()); }

let chRoot = null, storeRoot = null, phEl = null, embedEl = null, embedUrl = null;
const AD_BLOCKED = new Set(['clusterduck', 'pvz2']);
function showView(v){
  const home = v === 'home';
  $('#statusbar').classList.toggle('appbg', !home);
  wrapEl.style.display = home ? '' : 'none';
  dotsEl.style.display = home ? '' : 'none';
  dockEl.style.display = home ? '' : 'none';
  gestEl.style.display = home ? '' : 'none';
  if (chRoot) chRoot.style.display = (v === 'chromium') ? '' : 'none';
  if (storeRoot) storeRoot.style.display = (v === 'store') ? '' : 'none';
  const app = appById(v);
  if (embedEl) embedEl.style.display = (app && app.url) ? '' : 'none';
  if (phEl) phEl.style.display = 'none';
  if (home){
    avEl.hidden = true;
    closeFolder(false);
    if (editing){ editing = false; pagerEl.classList.remove('editing'); rebuildTrack(); setTrackX(false); }
    return;
  }
  avEl.hidden = false;
  if (v === 'store'){
    if (!storeRoot) storeRoot = buildStore();
    if (storeRoot.parentElement !== avEl) avEl.appendChild(storeRoot);
    return;
  }
  if (v === 'chromium'){
    if (!chRoot){ chRoot = buildChromium(); avEl.appendChild(chRoot); renderCh(); }
    else {
      const tm = chRoot.querySelector('.ch-tabsmenu');
      if (tm) tm.remove();
      if (chRoot.parentElement !== avEl) avEl.appendChild(chRoot);
      chRoot.style.display = '';
      layoutTabs();
    }
    return;
  }
  if (app && app.url){
    if (!embedEl){
      embedEl = document.createElement('iframe');
      embedEl.className = 'appembed';
      avEl.appendChild(embedEl);
    }
    if (AD_BLOCKED.has(app.id)){
      embedEl.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms');
      embedEl.setAttribute('referrerpolicy', 'no-referrer');
    } else {
      embedEl.removeAttribute('sandbox');
      embedEl.removeAttribute('referrerpolicy');
    }
    if (embedUrl !== app.url){ embedUrl = app.url; embedEl.src = app.url; }
    return;
  }
  if (!phEl){
    phEl = document.createElement('div');
    phEl.className = 'avbox';
    phEl.innerHTML = `<div class="avic"></div><div class="avname"></div><div class="avsub">Not available yet</div>`;
    avEl.appendChild(phEl);
  }
  phEl.style.display = '';
  if (app){
    phEl.querySelector('.avic').innerHTML = appIconSVG(app);
    phEl.querySelector('.avname').textContent = app.name;
  }
}
function destroyChromium(){
  if (chRoot){ chRoot.remove(); chRoot = null; }
  CH.normal = { tabs: [chTab()], cur: 0 };
  CH.inc = { tabs: [chTab()], cur: 0 };
  CH.mode = 'n';
  closedStack.length = 0;
}
addEventListener('message', e => {
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'mumu-view') showView(d.view === 'app' ? d.id : 'home');
  if (d.type === 'mumu-app-closed' && d.id === 'chromium') destroyChromium();
});

function hostOf(u){ try { return new URL(u).hostname; } catch (e) { return u; } }

function entTitle(e){
  if (e.type === 'newtab') return 'New Tab';

function isUrlLike(t){

function layoutTabs(oldW){
  if (!chRoot || !chRoot.isConnected || chRoot.style.display === 'none') return;

    els.forEach(el => { el.style.transition = 'none'; el.style.width = oldW + 'px'; });

function chNewTab(){

function chCloseAt(i){
  const arr = tabsArr();
  if (arr.length === 1){
    closedStack.push({ tab: arr[0], idx: 0, title: entTitle(arr[0].hist[arr[0].idx]), mode: CH.mode });
    showSnack(closedStack[closedStack.length - 1].title);
    arr[0] = chTab();
    curArr().cur = 0;
  } else {
    const tb = arr[i];
    closedStack.push({ tab: tb, idx: i, title: entTitle(tb.hist[tb.idx]), mode: CH.mode });
    showSnack(closedStack[closedStack.length - 1].title);
    arr.splice(i, 1);
    if (i < curArr().cur) curArr().cur--;
    if (curArr().cur >= arr.length) curArr().cur = arr.length - 1;
  }
  renderCh();
}
function closeChTab(i){

  const plus = chRoot.querySelector('.ch-new');

    s.addEventListener('click', () => hideSnack());

addEventListener('pointermove', e => {
  if (!tabDrag || !chRoot || chRoot.style.display === 'none') return;
  const strip = chRoot.querySelector('.ch-strip');
  const els = [...strip.querySelectorAll('.ch-tab')];
  if (!els.length) return;
  let before = 0;
  els.forEach((el, i) => {
    if (i === tabDrag.idx) return;
    const r = el.getBoundingClientRect();
    if (e.clientX > r.left + r.width / 2) before++;
  });
  if (before === tabDrag.idx) return;
  const arr = tabsArr();
  const sel = arr[curArr().cur];
  const olds = els.map(el => el.getBoundingClientRect());
  const [moved] = arr.splice(tabDrag.idx, 1);
  arr.splice(before, 0, moved);
  curArr().cur = arr.indexOf(sel);
  tabDrag.idx = before;
  renderStrip(false);
  flipTabs(olds);
});
addEventListener('pointerup', () => { tabDrag = null; });

          const inp = chRoot.querySelector('.ch-addr-in');
          const ent = chEnt();
          if (inp && document.activeElement !== inp) inp.value = addrOf(ent);
          if (ent.type === 'newtab') renderChContent(ent);
        });
        col.appendChild(row);
      });
    };
    render();
    body.appendChild(col);
  });
}
function openThemePage(){
  slidePanel('Theme', body => {
    const col = document.createElement('div');
    col.className = 'chp-col';
    const render = () => {
      col.innerHTML = '';
      [['light', 'Light'], ['dark', 'Dark']].forEach(([id, name]) => {
        const row = document.createElement('button');
        row.className = 'chp-eng' + (CH.theme === id ? ' on' : '');
        row.innerHTML = `<span class="rad"><i></i></span><span class="chp-l">${name}</span>`;
        row.addEventListener('click', () => {
          if (CH.theme === id) return;
          CH.theme = id;
          chRoot.classList.toggle('light', id === 'light');
          render();
        });
        col.appendChild(row);
      });
    };
    render();
    body.appendChild(col);
  });
}
function openHomepagePage(){
  slidePanel('Homepage', body => {
    const col = document.createElement('div');
    col.className = 'chp-col';
    const render = () => {
      col.innerHTML = `
        <div class="chp-row2"><span>On</span><button class="chsw${CH.homepage.on ? ' on' : ''}" aria-label="Homepage on"><i></i></button></div>
        <div class="chp-div"></div>
        <button class="chp-eng${CH.homepage.mode === 'default' ? ' on' : ''}" data-h="default"><span class="rad"><i></i></span><span class="chp-l">Chrome's homepage</span></button>
        <div class="chp-eng${CH.homepage.mode === 'custom' ? ' on' : ''}" data-h="custom"><span class="rad"><i></i></span><input class="chp-url" placeholder="Enter custom web address" spellcheck="false"></div>`;
      col.querySelector('.chsw').addEventListener('click', () => {
        CH.homepage.on = !CH.homepage.on;
        render();
      });
      col.querySelector('[data-h="default"]').addEventListener('click', () => {
        CH.homepage.mode = 'default';
        render();
      });
      const inp = col.querySelector('.chp-url');
      if (CH.homepage.custom) inp.value = CH.homepage.custom;
      inp.addEventListener('input', () => {
        const v = inp.value.trim();
        if (v && isUrlLike(v)){
          CH.homepage.mode = 'custom';
          CH.homepage.custom = /^([a-z][a-z0-9+.-]*:\/\/)/i.test(v) ? v : 'https://' + v;
          col.querySelectorAll('.chp-eng').forEach(r => r.classList.toggle('on', r.dataset.h === 'custom'));
        }
      });
    };
    render();
    body.appendChild(col);
  });
}

function openShotViewer(root, shots, idx){
  const v = document.createElement('div');
  v.className = 'gd-view';
  v.innerHTML = `
    <img class="gv-img" alt="">
    <button class="gv-btn gv-l" aria-label="Previous">${CH_LEFT}</button>
    <button class="gv-btn gv-r" aria-label="Next">${CH_RIGHT}</button>
    <button class="gv-x" aria-label="Close">${CH_X}</button>`;
  const img = v.querySelector('.gv-img');
  const L = v.querySelector('.gv-l'), R = v.querySelector('.gv-r'), X = v.querySelector('.gv-x');
  const place = () => {
    if (!img.complete || !img.naturalWidth) return;
    const r = img.getBoundingClientRect(), vr = v.getBoundingClientRect();
    L.style.top = R.style.top = (r.top - vr.top + r.height / 2 - 22) + 'px';
    L.style.left = Math.max(6, r.left - vr.left - 52) + 'px';
    R.style.left = Math.min(vr.width - 50, r.right - vr.left + 8) + 'px';
    X.style.left = (r.right - vr.left - 34) + 'px';
    X.style.top = Math.max(6, r.top - vr.top - 42) + 'px';
  };
  const set = i => {
    idx = (i + shots.length) % shots.length;
    img.src = shots[idx];
    if (img.complete && img.naturalWidth) requestAnimationFrame(place);
  };
  img.addEventListener('load', () => requestAnimationFrame(place));
  set(idx);
  X.addEventListener('click', e => { e.stopPropagation(); v.remove(); });
  L.addEventListener('click', e => { e.stopPropagation(); set(idx - 1); });
  R.addEventListener('click', e => { e.stopPropagation(); set(idx + 1); });
  v.addEventListener('click', e => { if (e.target === v) v.remove(); });
  root.appendChild(v);
}

function matchGame(q, g){
  const n = g.name.toLowerCase();
  const s = q.trim().toLowerCase();
  if (!s) return { score: 4, idx: [], exact: false };
  if (n === s) return { score: -1, idx: [...n].map((_, i) => i), exact: true };
  if (n.startsWith(s)) return { score: 0, idx: [...s].map((_, i) => i), exact: false };
  const words = n.split(/\s+/);
  const wi = words.findIndex(w => w.startsWith(s));
  if (wi > -1){
    let off = 0;
    for (let i = 0; i < wi; i++) off += words[i].length + 1;
    return { score: 1, idx: [...s].map((_, i) => off + i), exact: false };
  }
  const i = n.indexOf(s);
  if (i > -1) return { score: 2, idx: [...s].map((_, k) => i + k), exact: false };
  const idx = [];
  let j = 0;
  for (let k = 0; k < n.length && j < s.length; k++) if (n[k] === s[j]) { idx.push(k); j++; }
  if (j === s.length) return { score: 3, idx, exact: false };
  return null;
}
function search(q){
  const scored = [];
  GAMES.forEach(g => {
    const m = matchGame(q, g);
    if (m) scored.push({ g, m });
  });
  scored.sort((a, b) => a.m.score - b.m.score || a.g.name.localeCompare(b.g.name));
  return scored;
}

  return { page: pages.length - 1, idx: 0 };
}

    renderRow(g);
  });
  if (!scored.length){
    const p = document.createElement('p');
    p.className = 'st-none';
    p.textContent = 'No results';
    grid.appendChild(p);
  }
}
function wireSearch(view){
  const inp = view.querySelector('.st-search');
  const back = view.querySelector('.st-back');
  const drop = view.querySelector('.st-drop');
  const grid = view.querySelector('.st-grid');
  const cover = view.querySelector('.st-cover');
  const openSearch = () => {
    view.classList.add('searching');
    view.classList.remove('committed');
    storeRoot.classList.add('st-searching');
    renderDrop(drop, inp.value);
  };
  const closeSearch = () => {
    inp.value = '';
    inp.blur();
    view.classList.remove('searching', 'committed');
    storeRoot.classList.remove('st-searching');
    drop.innerHTML = '';
    grid.innerHTML = '';
  };
  inp.addEventListener('focus', () => {
    if (!view.classList.contains('searching') && !view.classList.contains('committed')) openSearch();
  });
  inp.addEventListener('input', () => {
    if (!view.classList.contains('searching')) openSearch();
    else renderDrop(drop, inp.value);
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter'){
      e.preventDefault();
      view.classList.remove('searching');
      view.classList.add('committed');
      storeRoot.classList.add('st-searching');
      renderGrid(grid, inp.value);
      inp.blur();
    }
  });
  back.addEventListener('click', closeSearch);
  cover.addEventListener('mousedown', closeSearch);
}
let curCat = 'all';
function buildStore(){
  const root = document.createElement('div');
  root.className = 'store';
  storeRoot = root;
  root.innerHTML = `
    <div class="st-head"><div class="st-ico">${appIconSVG(BASE[0])}</div></div>
    <div class="st-main">
      <nav class="st-tabs">
        <button class="st-tab sel" data-t="featured" role="tab"><span class="ti"></span><span>Featured</span></button>
        <button class="st-tab" data-t="category" role="tab"><span class="ti"></span><span>Category</span></button>
        <button class="st-tab" data-t="manage" role="tab"><span class="ti"></span><span>Manage Apps</span></button>
      </nav>
      <div class="st-div"></div>
      <div class="st-content">
        <div class="st-pane on" data-pane="featured">
          <div class="st-view">
            <h2 class="st-h">Suggested For You</h2>
            <div class="st-swrap">
              <button class="st-back" aria-label="Back">${ST_BACK}</button>
              <input class="st-search" placeholder="Search apps &amp; games" spellcheck="false" aria-label="Search apps">
            </div>
            <div class="st-cover"></div>
            <div class="st-drop"></div>
            <div class="st-grid"></div>
          </div>
        </div>
        <div class="st-pane" data-pane="category">
          <div class="st-view">
            <h2 class="st-h">Category</h2>
            <div class="st-swrap">
              <button class="st-back" aria-label="Back">${ST_BACK}</button>
              <input class="st-search" placeholder="Search apps &amp; games" spellcheck="false" aria-label="Search apps">
            </div>
            <div class="st-cover"></div>
            <div class="st-drop"></div>
            <div class="st-grid"></div>
            <div class="st-cats"></div>
            <div class="st-catgrid"></div>
          </div>
        </div>
        <div class="st-pane" data-pane="manage"><div class="st-soon">Coming soon</div></div>
      </div>
    </div>`;
  const setTab = t => {
    root.querySelectorAll('.st-tab').forEach(b => {
      const on = b.dataset.t === t;
      b.classList.toggle('sel', on);
      const ti = b.querySelector('.ti');
      if (b.dataset.t === 'featured') ti.innerHTML = stFeat(on);
      if (b.dataset.t === 'category') ti.innerHTML = stCatWrap(on);
      if (b.dataset.t === 'manage')   ti.innerHTML = stMan(on);
    });
    root.querySelectorAll('.st-pane').forEach(p => p.classList.toggle('on', p.dataset.pane === t));
  };
  root.querySelectorAll('.st-tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.t)));
  setTab('featured');
  root.querySelectorAll('.st-view').forEach(wireSearch);
  const cats = root.querySelector('.st-cats');
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'st-catbtn' + (c.id === curCat ? ' sel' : '');
    b.dataset.cat = c.id;
    b.innerHTML = `${c.ic || ''}<span></span>`;
    b.querySelector('span').textContent = c.name;
    b.addEventListener('click', () => {
      curCat = c.id;
      root.querySelectorAll('.st-catbtn').forEach(x => x.classList.toggle('sel', x === b));
      renderCatGrid();
    });
    cats.appendChild(b);
  });
  renderCatGrid();
  root.addEventListener('click', e => {
    if (e.target.closest('.gdet')) return;
    const btn = e.target.closest('.sr-btn');
    if (btn){
      const row = btn.closest('.sr');
      const g = GAMES.find(x => x.id === row.dataset.g);
      if (!g) return;
      const st = gameState(g);
      if (st === 'idle') startInstall(g);
      else if (st === 'dl' || st === 'inst') cancelInstall(g);
      else {
        const app = installed.find(a => a.id === g.id);
        if (app) openApp(app, row.querySelector('.sr-icwrap'));
      }
      return;
    }
    /* clicking anywhere else on an app row opens its detail page */
    const row = e.target.closest('.sr');
    if (row){
      const g = GAMES.find(x => x.id === row.dataset.g);
      if (g) openGameDetail(g);
    }
  });
  return root;
}
function renderCatGrid(){
  if (!storeRoot) return;
  const cg = storeRoot.querySelector('.st-catgrid');
  cg.innerHTML = '';
  const list = curCat === 'all' ? GAMES : GAMES.filter(g => g.cat === curCat);
  list.forEach(g => {
    const el = document.createElement('div');
    el.className = 'sr';
    el.dataset.g = g.id;
    cg.appendChild(el);
    renderRow(g);
  });
  if (!list.length){
    const p = document.createElement('p');
    p.className = 'st-none';
    p.textContent = 'No games in this category yet';
    cg.appendChild(p);
  }
}

/* ============ clock ============ */
function tick(){
  const d = new Date();
  let h = d.getHours() % 12; if (h === 0) h = 12;
  $('#clock').textContent = h + ':' + String(d.getMinutes()).padStart(2, '0');
}
tick(); setInterval(tick, 5000);

/* ============ boot ============ */
(function bootProgress(){
  const line = $('.bb-line'), pct = $('.bb-pct');
  const T = 2600;
  const Pp = [[0,0],[340,12],[640,38],[780,40],[1240,66],[1380,68],[2000,94],[2280,100]];
  const t0 = performance.now();
  (function step(now){
    const t = now - t0;
    let v = 100;
    for (let i = 1; i < Pp.length; i++){
      if (t <= Pp[i][0]){
        const [ta, va] = Pp[i - 1], [tb, vb] = Pp[i];
        v = va + (vb - va) * (t - ta) / (tb - ta);
        break;
      }
      v = Pp[i][1];
    }
    line.style.width = v + '%';
    pct.textContent = Math.round(v) + '%';
    if (t < T - 40) requestAnimationFrame(step);
  })(t0);
})();
setTimeout(() => {
  $('#splash').classList.add('hide');
  $('#bootbar').classList.add('hide');
  uiEl.classList.add('ready');
  setTimeout(() => { $('#splash').remove(); $('#bootbar').remove(); }, 700);
}, 2600);

/* ============ init ============ */
draw();
setScale();
renderHome();
addEventListener('resize', () => {
  draw();
  setScale();
  setTrackX(false);
  if (chRoot && chRoot.isConnected && chRoot.style.display !== 'none') layoutTabs();
});
loadDevState(st => {
  if (st && Array.isArray(st.installed)){
    installed = st.installed.filter(d => d && d.id && d.url)
      .map(d => ({ id: String(d.id), name: String(d.name || 'App'), icon: fixIcon(String(d.id), String(d.icon || '')), url: fixUrl(String(d.id), String(d.url)) }));
    if (Array.isArray(st.pages)){
      pages = st.pages.map(p => {
        const arr = (p || []).slice(0, 18).map(deSlot);
        while (arr.length < 18) arr.push(null);
        return arr;
      });
      if (!pages.length) pages = [new Array(18).fill(null)];
    } else if (Array.isArray(st.home)){
      const p0 = st.home.slice(0, 18).map(deSlot);
      while (p0.length < 18) p0.push(null);
      pages = [p0];
      if (!pages[0].some(s => s && s.fid === 'gadgets')){
        const slot = pages[0].findIndex(s => !s);
        if (slot > -1) pages[0][slot] = gadgetsFolder();
      }
    }
    if (Array.isArray(st.dock)){
      dockSlots = st.dock.slice(0, 4).map(deSlot);
    }
    while (dockSlots.length < 4) dockSlots.push(null);
    if (Array.isArray(st.newApps)) newBadges = new Set(st.newApps.map(String));
    pageIdx = 0;
    renderHome();
  }
});

addEventListener('keydown', e => {
  if (chRoot && chRoot.style.display !== 'none' && (e.ctrlKey || e.metaKey)){
    const k = e.key.toLowerCase();
    if (e.shiftKey && k === 't'){ e.preventDefault(); reopenClosedTab(); return; }
    if (!e.shiftKey && (k === 't' || k === 'n')){ e.preventDefault(); chNewTab(); return; }
    if (k === 'w'){ e.preventDefault(); closeChTab(curArr().cur); return; }
  }
  if (e.key !== 'Escape') return;
  if (chRoot && chRoot.querySelector('.ch-panel')){
    chRoot.querySelectorAll('.ch-panel').forEach(p => p.remove());
    return;
  }
  if (folderOpen){ closeFolder(true); return; }
  if (chRoot){
    const dlg = chRoot.querySelector('.ch-dlg');
    if (dlg){ dlg.remove(); return; }
    const pop = chRoot.querySelector('.ch-popwrap');
    if (pop){ pop.remove(); return; }
    const tm = chRoot.querySelector('.ch-tabsmenu');
    if (tm){ tm.remove(); return; }
    const snack = chRoot.querySelector('.ch-snack.show');
    if (snack){ hideSnack(); return; }
  }
  if (storeRoot){
    const view = storeRoot.querySelector('.gd-view');
    if (view){ view.remove(); return; }
    if (gdOpen){ gdOpen.root.querySelector('.gd-back').click(); return; }
  }
  if (window.parent !== window && DEV && DEV.id != null){
    parent.postMessage({ type: 'mumu-close', id: DEV.id }, '*');
  }
});
})();
</script>
