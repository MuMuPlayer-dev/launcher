<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUMUPlayer</title>
<link rel="icon" href="https://images.dwncdn.net/images/t_app-icon-l/p/d520014e-daf4-451a-8a8c-9aacc33f4d25/2693453914/mumuplayer-1-logo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#060a17;color:#fff;cursor:default;font-family:'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,Arial,sans-serif;user-select:none;-webkit-user-select:none}
body{cursor:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='26'%20height='26'%20viewBox='0%200%2026%2026'%3E%3Cpath%20d='M3%202.5%20L3%2019.5%20L15.5%2011%20Z'%20fill='%23ffffff'%20stroke='%23000000'%20stroke-width='1.7'%20stroke-linejoin='round'/%3E%3Ccircle%20cx='11.3'%20cy='15.3'%20r='2.4'%20fill='%234aa3e8'%20stroke='%23000000'%20stroke-width='1.3'/%3E%3C/svg%3E") 3 3, auto}
button,input,a,[role="button"],label{cursor:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus{outline:none}
button:focus-visible{outline:2px solid rgba(255,255,255,.5);outline-offset:3px;border-radius:14px}
input{user-select:text;-webkit-user-select:text}

#wall{position:fixed;inset:0;z-index:0;display:block}

#ui{position:fixed;top:0;left:0;width:calc(100% / var(--s,1));height:calc(100% / var(--s,1));z-index:1;opacity:0;transform:scale(var(--s,1));transform-origin:0 0;transition:opacity .7s var(--ease),transform .16s ease-out}
#ui.ready{opacity:1}

/* status bar: bigger wifi close to the data triangle, tall skinny battery */
#statusbar{position:absolute;top:0;left:0;right:0;height:42px;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:15px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5);transition:background .25s ease}
#statusbar.appbg{background:#000}
.sb-right{display:flex;align-items:center;gap:12px}
.sb-pair{display:flex;align-items:center;gap:6px}
.sb-right svg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}

#appgrid{position:absolute;left:0;right:0;top:48px;bottom:134px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(3,1fr);transition:transform .3s var(--ease),background .3s ease}
.cell{position:relative;display:flex;align-items:center;justify-content:center;min-width:0}
.cell.drop::after{content:"";position:absolute;inset:8%;border-radius:16px;border:2.5px solid rgba(135,198,255,.9);background:rgba(135,198,255,.16);pointer-events:none}
#appgrid.editing{transform:scale(.84);border-radius:22px;background:rgba(135,198,255,.10);outline:2.5px solid rgba(135,198,255,.8);outline-offset:9px}
.app{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;touch-action:none}
.app .ic{width:66px;height:66px;transition:transform .16s var(--ease)}
.app .ic svg{width:100%;height:100%;display:block}
.app:active .ic{transform:scale(.88)}
.app .lb{font-size:13px;font-weight:500;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#dock{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);display:flex;gap:18px}
.dcell{width:78px;height:72px}
#dock .app{gap:0}
#dock .app .lb{display:none}
#gest{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);width:118px;height:4px;border-radius:99px;background:rgba(255,255,255,.55)}

.ghost{position:fixed;z-index:99;pointer-events:none;width:72px;height:72px;transform:translate(-50%,-58%);filter:drop-shadow(0 16px 30px rgba(0,0,0,.55))}
.ghost svg{width:100%;height:100%;display:block}

#appview{position:absolute;left:0;right:0;top:42px;bottom:0;z-index:2}
#appview[hidden]{display:none}
.avbox{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:avIn .45s var(--ease) both}
@keyframes avIn{from{opacity:0;transform:translateY(12px)}}
.avic{width:92px;height:92px;filter:drop-shadow(0 10px 26px rgba(0,0,0,.5))}
.avic svg{width:100%;height:100%;display:block}
.avname{font-size:24px;font-weight:600;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.avsub{font-size:13px;color:#a9b0ba;margin-top:-4px}
.appembed{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}

.appanim{position:fixed;inset:0;z-index:6;background:#0a0c12;display:flex;align-items:center;justify-content:center;transition:clip-path .38s var(--ease),opacity .35s ease}
.appanim.fade{opacity:0}
.aa-ic{width:118px;height:118px;transition:transform .38s var(--ease)}
.aa-ic svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 30px rgba(0,0,0,.55))}

#splash{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;transition:opacity .65s ease}
#splash.hide{opacity:0;pointer-events:none}
.spl-card{display:flex;flex-direction:column;align-items:center;gap:22px;padding:54px 88px;border-radius:30px;background:rgba(6,11,25,.38);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(16px) saturate(1.15);animation:splIn .8s var(--ease) both}
@keyframes splIn{from{opacity:0;transform:scale(.93) translateY(12px)}}
.spl-logo{width:98px;height:98px;border-radius:24px;display:block;user-select:none;-webkit-user-drag:none}
.spl-name{font-size:46px;font-weight:600;letter-spacing:.015em;color:#fff;text-shadow:0 2px 18px rgba(90,150,220,.35)}

#bootbar{position:fixed;left:0;right:0;bottom:0;height:34px;z-index:6;background:rgba(14,16,22,.55);backdrop-filter:blur(6px);transition:opacity .55s ease}
#bootbar.hide{opacity:0}
.bb-line{position:absolute;top:0;left:0;height:3px;width:0%;background:linear-gradient(90deg,#2b6fe0,#54d0e1)}
.bb-dot{position:absolute;right:-4px;top:1.5px;transform:translateY(-50%);width:9px;height:9px;border-radius:50%;background:#fff;box-shadow:0 0 10px 2px rgba(90,170,255,.85),0 0 3px 1px rgba(120,190,255,.9)}
.bb-pct{position:absolute;right:16px;bottom:8px;font-size:12px;font-weight:600;color:#5db4e8;font-variant-numeric:tabular-nums}

/* ============ CHROMIUM ============ */
.chromium{position:absolute;inset:0;display:flex;flex-direction:column;background:#0e0f12;animation:avIn .4s var(--ease) both}
.ch-strip{height:40px;flex:none;display:flex;align-items:stretch;padding:0 6px;background:#0e0f12}
/* tabs no longer fill the strip: the + button sits right beside the last tab */
.ch-tabs{display:flex;align-items:stretch;flex:0 1 auto;min-width:0;overflow:hidden;padding:0 10px}
.ch-new{align-self:center;width:30px;height:28px;margin-left:2px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#b9bdc3;transition:background .13s,color .13s;flex:none}
.ch-new:hover{background:rgba(255,255,255,.09);color:#fff}
.ch-new svg{width:13px;height:13px}
.ch-tab{position:relative;display:flex;align-items:center;gap:8px;padding:0 8px 0 12px;margin-right:12px;border-radius:10px 10px 0 0;font-size:12.5px;font-weight:600;color:#b9bdc3;white-space:nowrap;min-width:56px;flex:none;background:#121317;overflow:hidden}
.ch-tab.sel{background:#191b21;color:#e8eaee}
.ch-tab .hv{position:absolute;left:5px;right:5px;top:5px;bottom:5px;border-radius:7px;background:rgba(255,255,255,.09);opacity:0;transition:opacity .15s;pointer-events:none}
.ch-tab:not(.sel):hover .hv{opacity:1}
.ch-tab>*:not(.hv){position:relative}
.ch-tab.sel::before{content:"";position:absolute;left:-10px;bottom:0;width:10px;height:10px;background:radial-gradient(circle 10px at 0% 0%, rgba(0,0,0,0) 9.4px, #191b21 9.5px)}
.ch-tab.sel::after{content:"";position:absolute;right:-10px;bottom:0;width:10px;height:10px;background:radial-gradient(circle 10px at 100% 0%, rgba(0,0,0,0) 9.4px, #191b21 9.5px)}
.ch-tab:not(.sel)::before{content:"";position:absolute;left:-10px;bottom:0;width:10px;height:10px;background:radial-gradient(circle 10px at 0% 0%, rgba(0,0,0,0) 9.4px, #121317 9.5px)}
.ch-tab:not(.sel)::after{content:"";position:absolute;right:-10px;bottom:0;width:10px;height:10px;background:radial-gradient(circle 10px at 100% 0%, rgba(0,0,0,0) 9.4px, #121317 9.5px)}
.ch-tab.in{animation:chTabIn .34s var(--ease) both}
.ch-tab.out{animation:chTabOut .19s ease both}
@keyframes chTabIn{from{opacity:0;transform:translateY(38px)}}
@keyframes chTabOut{to{opacity:0;transform:translateY(38px)}}
.ch-tic{position:relative;width:16px;height:16px;flex:none;color:#9aa0a6}
.ch-tab.sel .ch-tic{color:#c7ccd4}
.ch-tic svg{position:absolute;inset:0;width:100%;height:100%}
.ch-fav{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.ch-tname{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;display:block}
.ch-tname.ov{mask-image:linear-gradient(90deg,#000 70%,transparent 100%);-webkit-mask-image:linear-gradient(90deg,#000 70%,transparent 100%)}
.ch-tx{width:18px;height:18px;flex:none;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#b9bdc3;opacity:.65;transition:background .12s,color .12s,opacity .12s}
.ch-tx:hover{background:#d5432f;color:#fff;opacity:1}
.ch-tx svg{width:8px;height:8px}
.ch-bar{height:54px;flex:none;background:#191b21;display:flex;align-items:center;gap:3px;padding:0 10px}
.ch-btn{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;transition:background .13s}
.ch-btn:hover{background:rgba(255,255,255,.08)}
.ch-btn svg{width:19px;height:19px;display:block}
.ch-btn.dis{color:#8f939b;pointer-events:none}
.ch-addr{flex:1;min-width:0;height:38px;background:#282e38;border-radius:999px;display:flex;align-items:center;gap:7px;padding:0 6px 0 15px;color:#c7ccd4;margin-left:5px}
.ch-addr>svg{width:12px;height:14px;flex:none}
.ch-addr-in{flex:1;min-width:0;background:none;border:0;outline:0;color:#c7ccd4;font:400 13px/1 'Roboto',sans-serif}
.ch-addr-in::selection{background:rgba(90,170,255,.35)}
.ch-addrbtn{width:30px;height:30px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#c7ccd4;transition:background .12s,color .12s}
.ch-addrbtn:hover{background:rgba(255,255,255,.10);color:#e8eaee}
.ch-addrbtn svg{width:16px;height:16px}
.ch-star svg path{fill:none}
.ch-star.marked svg path{fill:currentColor}
.ch-count{width:32px;height:32px;flex:none;border-radius:9px;border:1.7px solid #cfd4da;color:#cfd4da;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;transition:background .12s}
.ch-count:hover{background:rgba(255,255,255,.10)}
.ch-bmbar{height:34px;flex:none;display:none;align-items:center;gap:4px;padding:0 10px;background:#1d1f24;overflow-x:auto;scrollbar-width:none}
.ch-bmbar::-webkit-scrollbar{display:none}
.bm{display:flex;align-items:center;gap:7px;height:26px;padding:0 12px;border-radius:7px;color:#c7ccd4;font-size:12.5px;font-weight:600;max-width:190px;white-space:nowrap;overflow:hidden;flex:none;transition:background .13s}
.bm:hover{background:rgba(255,255,255,.09);color:#e8eaee}
.bm img{width:14px;height:14px;flex:none;object-fit:contain}
.ch-content{flex:1;position:relative;background:#1c1d21}
.ch-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.ch-nt{position:absolute;inset:0;background:#1c1d21;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.nt-logo{width:220px;max-width:64%;user-select:none;-webkit-user-drag:none}
.nt-search{width:560px;max-width:84%;height:46px;border-radius:999px;background:#474b52;display:flex;align-items:center;gap:14px;padding:0 20px;color:#fff}
.nt-search svg{width:17px;height:17px;flex:none}
.nt-search span{font-size:14px;color:#a9adb3;text-align:left;flex:1}
.ch-ntm{position:absolute;inset:0;z-index:5;background:#1c1d21;display:flex;flex-direction:column;animation:avIn .25s ease both}
.ntm-top{display:flex;align-items:center;gap:12px;padding:16px 18px 12px}
.ntm-back{width:34px;height:34px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#4a8fe8;transition:background .13s}
.ntm-back:hover{background:rgba(74,143,232,.14)}
.ntm-back svg{width:20px;height:20px}
.ntm-in{flex:1;height:44px;border-radius:999px;background:#474b52;border:0;outline:0;color:#e8eaee;font:400 14.5px/1 'Roboto',sans-serif;padding:0 20px}
.ntm-in::selection{background:rgba(90,170,255,.35)}
.ntm-line{height:1px;background:#8f939b;opacity:.55;margin:0 18px}
.ch-fb{position:absolute;inset:0;background:#1c1d21;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#b9bdc3;padding:20px;text-align:center}
.fb-globe{width:54px;height:54px;color:#6f747c}
.fb-globe svg{width:100%;height:100%}
.fb-host{font-size:17px;font-weight:600;color:#e8eaee}
.fb-msg{font-size:13.5px;max-width:420px;line-height:1.6}
.fb-open{margin-top:10px;height:38px;padding:0 22px;border-radius:999px;background:#474b52;color:#e8eaee;font-size:13.5px;font-weight:600;display:flex;align-items:center;text-decoration:none;transition:background .15s}
.fb-open:hover{background:#53585f}
.ch-tabsmenu{position:absolute;inset:0;z-index:50;background:#030305;display:flex;flex-direction:column;animation:avIn .22s ease both}
.tm-head{flex:none;display:flex;align-items:center;gap:10px;padding:14px 24px}
.tm-new{display:flex;align-items:center;gap:9px;height:38px;padding:0 16px 0 13px;border-radius:10px;color:#d6dade;font-size:13.5px;font-weight:600;transition:background .13s}
.tm-new:hover{background:rgba(255,255,255,.10)}
.tm-new svg{width:16px;height:16px;flex:none}
.tm-dots{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#d6dade;transition:background .13s;margin-left:auto}
.tm-dots:hover{background:rgba(255,255,255,.10)}
.tm-dots svg{width:17px;height:17px}
.tm-grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:8px 26px 34px;align-content:start}
.tm-box{background:#272e37;border-radius:11px;overflow:hidden;display:flex;flex-direction:column;text-align:left;transition:transform .15s var(--ease)}
.tm-box:hover{transform:translateY(-2px)}
.tm-box.sel{background:#8cb4f9}
.tm-row{display:flex;align-items:center;gap:8px;padding:8px 10px;color:#cfd4da}
.tm-box.sel .tm-row{color:#0c1016}
.tm-fav{position:relative;width:16px;height:16px;flex:none;color:#8f96a0}
.tm-fav svg{position:absolute;inset:0;width:100%;height:100%}
.tm-fav img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tm-name{flex:1;min-width:0;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm-x{width:22px;height:22px;flex:none;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#cfd4da;opacity:.75;transition:background .12s,color .12s,opacity .12s}
.tm-x:hover{background:#d5432f;color:#fff;opacity:1}
.tm-box.sel .tm-x{color:#0c1016}
.tm-x svg{width:9px;height:9px}
.tm-prev{height:122px;background:#1c1d21;overflow:hidden;position:relative;flex:none}
.tm-prev iframe{position:absolute;top:0;left:0;width:1280px;height:900px;border:0;pointer-events:none;background:#fff;transform-origin:0 0}
.tm-prev .tm-g{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.tm-prev .tm-g img{width:44%}
.tm-popwrap{position:absolute;inset:0;z-index:80}
.tm-pop{position:absolute;right:18px;top:62px;width:250px;background:#2c323f;border-radius:14px;padding:7px;box-shadow:0 18px 44px rgba(0,0,0,.5);animation:avIn .16s ease both}
.tm-pop .po{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:10px;color:#d6dade;font-size:13.5px;font-weight:600;transition:background .13s}
.tm-pop .po:hover{background:rgba(255,255,255,.08)}
.tm-pop .po svg{width:19px;height:19px;flex:none}
.ch-dlg{position:absolute;inset:0;z-index:90;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;animation:avIn .2s ease both}
.ch-dlgbox{width:410px;max-width:88%;background:#20262e;border-radius:16px;padding:26px 26px 20px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.ch-dlgt{font-size:20px;font-weight:600;color:#d9dde2}
.ch-dlgs{margin-top:10px;font-size:13.5px;line-height:1.55;color:#d9dde2}
.ch-dlgb{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-top:22px}
.dlg-cancel{color:#9aa3ac;font-size:13.5px;font-weight:600;padding:8px 12px;border-radius:8px;transition:background .13s}
.dlg-cancel:hover{background:rgba(255,255,255,.08)}
.dlg-ok{height:40px;padding:0 24px;border-radius:999px;background:#93c2fd;color:#20262e;font-size:13.5px;font-weight:700;transition:filter .15s}
.dlg-ok:hover{filter:brightness(1.07)}
/* undo snackbar: slides up from the bottom of the browser */
.ch-snack{position:absolute;left:50%;bottom:18px;transform:translate(-50%,150%);display:flex;align-items:center;gap:26px;min-width:300px;max-width:72%;height:46px;padding:0 8px 0 18px;background:#2b2d33;border-radius:12px;box-shadow:0 14px 34px rgba(0,0,0,.45);z-index:95;transition:transform .34s var(--ease);touch-action:none}
.ch-snack.show{transform:translate(-50%,0)}
.cs-txt{flex:1;min-width:0;color:#c3c7cd;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs-undo{color:#8cb4f9;font-size:13px;font-weight:700;padding:7px 12px;border-radius:8px;flex:none;transition:background .13s}
.cs-undo:hover{background:rgba(140,180,249,.16)}

/* ============ MUMU STORE ============ */
.store{position:absolute;inset:0;display:flex;flex-direction:column;background:#292b30;animation:avIn .4s var(--ease) both}
.st-head{height:56px;flex:none;display:flex;align-items:center;padding:0 18px}
.st-ico{width:34px;height:34px;border-radius:9px;overflow:hidden;flex:none}
.st-ico svg{width:100%;height:100%;display:block}
.st-main{flex:1;min-height:0;display:flex}
.st-tabs{width:198px;flex:none;display:flex;flex-direction:column;gap:5px;padding:12px 10px}
.store.st-searching .st-tabs,.store.st-searching .st-div{display:none}
.st-tab{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:12px;color:#c9ccd1;font-size:12.5px;font-weight:600;transition:background .15s}
.st-tab svg{width:30px;height:30px;display:block}
.st-tab:hover{background:rgba(120,175,235,.22)}
.st-tab.sel{background:#4a9de0;color:#fff}
.st-div{width:1px;flex:none;background:rgba(255,255,255,.14);margin:12px 0}
.st-content{flex:1;min-width:0;position:relative}
.st-pane{position:absolute;inset:0;display:none}
.st-pane.on{display:block}
.st-soon{height:100%;display:flex;align-items:center;justify-content:center;color:#8b8f96;font-size:15px;font-weight:600}
.st-view{position:absolute;inset:0}
.st-h{position:absolute;top:18px;left:24px;font-size:20px;font-weight:600;color:#fff;z-index:2}
.st-swrap{position:absolute;top:18px;left:calc(100% - 330px);width:306px;height:42px;display:flex;align-items:center;gap:8px;z-index:6;transition:left .32s cubic-bezier(.2,.8,.3,1),width .32s cubic-bezier(.2,.8,.3,1),transform .32s cubic-bezier(.2,.8,.3,1)}
.st-view.searching .st-swrap,.st-view.committed .st-swrap{left:50%;transform:translateX(-50%);width:60%}
.st-back{width:0;height:32px;flex:none;overflow:hidden;opacity:0;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#b9bec6;transition:opacity .25s,width .25s,background .15s}
.st-view.searching .st-back,.st-view.committed .st-back{width:32px;opacity:1}
.st-back:hover{background:rgba(185,190,198,.14)}
.st-back svg{width:19px;height:19px;flex:none}

<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);

let DEV = null;
try { DEV = JSON.parse(decodeURIComponent(location.hash.slice(1)) || 'null'); } catch (e) {}
if (DEV && DEV.name) document.title = DEV.name + ' — MUMUPlayer';
const devId = () => (DEV && DEV.id != null) ? DEV.id : 0;

/* ============ wallpaper (canvas, deterministic) ============ */
const cv = $('#wall'), cx = cv.getContext('2d');
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function paintWall(g, W, H){
  const m = Math.min(W, H);
  const rnd = mulberry32(0x4D554D21);
  const star = (x, y, s, a) => {
    const gr = g.createRadialGradient(x, y, 0, x, y, s * 4.5);
    gr.addColorStop(0, 'rgba(165,195,255,' + (0.55 * a).toFixed(3) + ')');
    gr.addColorStop(1, 'rgba(120,160,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x, y, s * 4.5, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
    g.beginPath(); g.arc(x, y, s, 0, 7); g.fill();
  };
  const crater = (x, y, r, lx, ly, dark, mid, rim) => {
    const la = Math.atan2(ly, lx);
    const gr = g.createRadialGradient(x + lx * r * 0.45, y + ly * r * 0.45, r * 0.1, x, y, r);
    gr.addColorStop(0, rim); gr.addColorStop(.6, mid); gr.addColorStop(1, dark);
    g.fillStyle = gr;
    g.beginPath(); g.ellipse(x, y, r, r * 0.94, 0, 0, 7); g.fill();
    g.lineWidth = Math.max(1, r * 0.16);
    g.strokeStyle = 'rgba(255,255,255,.30)';
    g.beginPath(); g.arc(x, y, r * 0.9, la - 0.85, la + 0.85); g.stroke();
    g.strokeStyle = 'rgba(0,0,25,.22)';
    g.beginPath(); g.arc(x, y, r * 0.9, la + Math.PI - 0.85, la + Math.PI + 0.85); g.stroke();
  };
  const rr = (x, y, w, h, r) => {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  };
  const bg = g.createLinearGradient(0, 0, W * 0.25, H);
  bg.addColorStop(0, '#0b1326'); bg.addColorStop(.55, '#091021'); bg.addColorStop(1, '#060a17');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const n = Math.max(60, Math.round(W * H / 9000));
  for (let i = 0; i < n; i++) star(rnd() * W, rnd() * H, 0.4 + rnd() * rnd() * 1.9, 0.55 + rnd() * 0.45);
  const mr = m * 0.52, mcx = -mr * 0.34, mcy = H + mr * 0.34;
  g.save();
  g.beginPath(); g.arc(mcx, mcy, mr, 0, 7); g.clip();
  const mg = g.createRadialGradient(mcx + mr * 0.55, mcy - mr * 0.55, mr * 0.1, mcx, mcy, mr);
  mg.addColorStop(0, '#eff1f3'); mg.addColorStop(.55, '#d5d9dd'); mg.addColorStop(1, '#b7bdc3');
  g.fillStyle = mg; g.fillRect(mcx - mr, mcy - mr, mr * 2, mr * 2);
  for (let i = 0; i < 9; i++){
    const ang = -(0.3 + rnd() * 1.05), d = mr * (0.28 + rnd() * 0.55);
    crater(mcx + Math.cos(ang) * d, mcy + Math.sin(ang) * d,
           mr * (0.04 + rnd() * 0.085), 0.7, -0.7, '#787e86', '#a6abb1', '#dfe2e5');
  }
  const term = g.createLinearGradient(mcx - mr * 0.8, mcy + mr * 0.8, mcx + mr * 0.6, mcy - mr * 0.6);
  term.addColorStop(0, 'rgba(4,7,20,0.97)'); term.addColorStop(.5, 'rgba(5,9,26,0.55)'); term.addColorStop(1, 'rgba(5,9,26,0)');
  g.fillStyle = term; g.fillRect(mcx - mr, mcy - mr, mr * 2, mr * 2);
  g.restore();
  g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2.5;
  g.beginPath(); g.arc(mcx, mcy, mr - 1.2, -0.785 - 0.65, -0.785 + 0.65); g.stroke();
  const ROT = 15 * Math.PI / 180;
  const PW = m * 0.085, PL = m * 0.36, gap = m * 0.05;
  const halfW = (PW / 2) * Math.cos(ROT) + (PL / 2) * Math.sin(ROT);
  const groupW = 4 * halfW + 2 * gap + PW;
  const rightX = W * 0.84, leftX = rightX - groupW, bottomY = H * 0.62;
  const circX = rightX - PW / 2, circY = bottomY - PW / 2;
  const pillY = bottomY - PW / 2 - (PL / 2 - PW / 2) * Math.cos(ROT);
  const pillAx = leftX + halfW, pillBx = leftX + 3 * halfW + gap;
  const shape = (kind, px, py) => {
    g.save();
    g.translate(px, py);
    if (kind === 'pill') g.rotate(ROT);
    const R = kind === 'pill' ? PL / 2 : PW / 2;
    const grad = g.createRadialGradient(0, 0, R * 0.08, 0, 0, R);
    grad.addColorStop(0, '#8ed2f3'); grad.addColorStop(.35, '#c4e4f7'); grad.addColorStop(1, '#eff8ff');
    const path = () => { if (kind === 'pill') rr(-PW / 2, -PL / 2, PW, PL, PW / 2); else { g.beginPath(); g.arc(0, 0, PW / 2, 0, 7); } };
    g.shadowColor = 'rgba(125,190,255,.38)'; g.shadowBlur = 64; g.shadowOffsetX = -54;
    g.fillStyle = grad; path(); g.fill();
    g.shadowColor = 'rgba(150,212,255,.62)'; g.shadowBlur = 26; g.shadowOffsetX = -20;
    path(); g.fill();
    g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetX = 0;
    g.fillStyle = grad; path(); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 1;
    path(); g.stroke();
    g.restore();
  };
  shape('pill', pillAx, pillY); shape('pill', pillBx, pillY); shape('circle', circX, circY);
  const pr = m * 0.17, pcx = W - pr * 1.3, pcy = pr * 1.5;
  g.save();
  g.beginPath(); g.arc(pcx, pcy, pr, 0, 7); g.clip();
  const pg = g.createRadialGradient(pcx - pr * 0.5, pcy + pr * 0.5, pr * 0.15, pcx, pcy, pr * 1.05);
  pg.addColorStop(0, '#c8dbdf'); pg.addColorStop(.6, '#a9c4cb'); pg.addColorStop(1, '#8fb0b9');
  g.fillStyle = pg; g.fillRect(pcx - pr, pcy - pr, pr * 2, pr * 2);
  const sh = g.createLinearGradient(pcx + pr * 0.85, pcy - pr * 0.85, pcx - pr * 0.7, pcy + pr * 0.7);
  sh.addColorStop(0, 'rgba(23,62,74,0.85)'); sh.addColorStop(.55, 'rgba(23,62,74,0.35)'); sh.addColorStop(1, 'rgba(23,62,74,0)');
  g.fillStyle = sh; g.fillRect(pcx - pr, pcy - pr, pr * 2, pr * 2);
  for (let i = 0; i < 8; i++){
    const a = rnd() * Math.PI * 2, d = rnd() * pr * 0.72;
    crater(pcx + Math.cos(a) * d, pcy + Math.sin(a) * d, pr * (0.05 + rnd() * 0.08), -0.7, 0.7, '#5d7b85', '#89a4ac', '#d3e6ea');
  }
  g.restore();
  g.strokeStyle = 'rgba(225,248,252,.5)'; g.lineWidth = 1.6;
  g.beginPath(); g.arc(pcx, pcy, pr - 0.8, Math.PI * 0.6, Math.PI * 1.1); g.stroke();
  const topBand = Math.max(8, (pcy - pr) - 18);
  for (let i = 0; i < 5; i++) star(pcx - pr * 1.05 + rnd() * pr * 2.1, 10 + rnd() * topBand, 0.7 + rnd() * 1.1, 0.9);
}
function draw(){
  const dpr = window.devicePixelRatio || 1;
  const W = innerWidth, H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintWall(cx, W, H);
}
const uiEl = $('#ui');
function setScale(){
  const s = Math.max(0.7, Math.min(1.22, Math.min(innerWidth / 1152, innerHeight / 672)));
  uiEl.style.setProperty('--s', s.toFixed(4));
}

/* ============ icons (unique ids per render) ============ */
let _uid = 0;
function uniqSVG(svg){
  if (typeof svg !== 'string') return svg;
  const map = {};
  return svg
    .replace(/id="([^"]+)"/g, (m, id) => { const n = id + '_x' + (++_uid); map[id] = n; return 'id="' + n + '"'; })
    .replace(/url\(#([^)"']+)\)/g, (m, id) => map[id] ? 'url(#' + map[id] + ')' : m)
    .replace(/href="#([^"]+)"/g, (m, id) => map[id] ? 'href="#' + map[id] + '"' : m);
}

/* ============ app registry + per-device persistence ============ */
const BASE = [
  { id: 'store',  name: 'MuMu Store' },
  { id: 'cloner', name: 'App Cloner' }
];
const DOCK_BASE = [
  { id: 'settings', name: 'Settings' },
  { id: 'gallery',  name: 'Gallery' },
  { id: 'files',    name: 'Files' },
  { id: 'chromium', name: 'Chromium' }
];
const ALL_BASE = BASE.concat(DOCK_BASE);
function baseById(id){ return ALL_BASE.find(a => a.id === id) || null; }
function appById(id){ return baseById(id) || installed.find(a => a.id === id) || null; }

let installed = [];
let homeSlots = new Array(18).fill(null);
let dockSlots = new Array(4).fill(null);
homeSlots[0] = BASE[0]; homeSlots[1] = BASE[1];
DOCK_BASE.forEach((a, i) => dockSlots[i] = a);

const DEVKEY = 'mumu.dev.' + devId();
const serApp = a => a ? (a.url ? { id: a.id, name: a.name, icon: a.icon, url: a.url } : { id: a.id }) : null;
const deApp  = d => {
  if (!d || !d.id) return null;
  if (d.url) return { id: String(d.id), name: String(d.name || 'App'), icon: String(d.icon || ''), url: String(d.url) };
  return baseById(String(d.id));
};
function persistDev(){
  const payload = { installed, home: homeSlots.map(serApp), dock: dockSlots.map(serApp) };
  try { localStorage.setItem(DEVKEY, JSON.stringify(payload)); } catch (e) {}
  try { parent.postMessage({ type: 'mumu-dev-save', id: devId(), state: payload }, '*'); } catch (e) {}
}
function loadDevState(cb){
  let local = null;
  try { local = JSON.parse(localStorage.getItem(DEVKEY)); } catch (e) {}
  if (local && Array.isArray(local.installed)) { cb(local); return; }
  let done = false;
  const onMsg = e => {
    const d = e.data;
    if (d && d.type === 'mumu-dev-state' && d.id === devId()){
      done = true; removeEventListener('message', onMsg);
      cb(d.state || null);
    }
  };
  addEventListener('message', onMsg);
  try { parent.postMessage({ type: 'mumu-dev-load', id: devId() }, '*'); } catch (e) {}
  setTimeout(() => { if (!done){ removeEventListener('message', onMsg); cb(null); } }, 600);
}

const gridEl = $('#appgrid'), dockEl = $('#dock'), gestEl = $('#gest'), avEl = $('#appview');
let suppressClick = false;
let dnd = null;

function renderHome(){
  gridEl.innerHTML = '';
  homeSlots.forEach((app, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.area = 'home';
    cell.dataset.idx = i;
    if (app) cell.appendChild(appBtn(app, i, cell));
    gridEl.appendChild(cell);
  });
  dockEl.innerHTML = '';
  dockSlots.forEach((app, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell dcell';
    cell.dataset.area = 'dock';
    cell.dataset.idx = i;
    if (app) cell.appendChild(appBtn(app, i, cell));
    dockEl.appendChild(cell);
  });
}
function appBtn(app, idx, cell){
  const b = document.createElement('button');
  b.className = 'app';
  b.setAttribute('aria-label', app.name);
  b.innerHTML = `<span class="ic">${appIconSVG(app)}</span><span class="lb"></span>`;
  b.querySelector('.lb').textContent = app.name;
  b.addEventListener('click', () => { if (!suppressClick) openApp(app, b.querySelector('.ic')); });
  b.addEventListener('pointerdown', e => holdStart(e, app, idx, cell, b));
  return b;
}
function holdStart(e, app, idx, cell, btn){
  if (e.button !== 0 || dnd) return;
  const st = { app, idx, cell, btn, started: false, ghost: null, target: null, lx: e.clientX, ly: e.clientY };
  dnd = st;
  try { btn.setPointerCapture(e.pointerId); } catch (err) {}
  st.holdT = setTimeout(() => beginDrag(st), 230);
  const move = ev => { st.lx = ev.clientX; st.ly = ev.clientY; if (st.started) dragMove(st, ev); };
  const up = () => {
    btn.removeEventListener('pointermove', move);
    btn.removeEventListener('pointerup', up);
    btn.removeEventListener('pointercancel', up);
    clearTimeout(st.holdT);
    if (st.started) endDrag(st);
    dnd = null;
  };
  btn.addEventListener('pointermove', move);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
}
function beginDrag(st){
  st.started = true;
  suppressClick = true;
  setTimeout(() => suppressClick = false, 400);
  const g = document.createElement('div');
  g.className = 'ghost';
  g.innerHTML = appIconSVG(st.app);
  g.style.left = st.lx + 'px';
  g.style.top = st.ly + 'px';
  document.body.appendChild(g);
  st.ghost = g;
  st.btn.style.visibility = 'hidden';
  gridEl.classList.add('editing');
}
function dragMove(st, ev){
  st.ghost.style.left = ev.clientX + 'px';
  st.ghost.style.top = ev.clientY + 'px';
  let hit = null;
  for (const c of gridEl.children){
    const r = c.getBoundingClientRect();
    if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom){ hit = c; break; }
  }
  if (!hit) for (const c of dockEl.children){
    const r = c.getBoundingClientRect();
    if (ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom){ hit = c; break; }
  }
  if (st.target) st.target.classList.remove('drop');
  st.target = (hit && hit !== st.cell) ? hit : null;
  if (st.target) st.target.classList.add('drop');
}
function endDrag(st){
  if (st.ghost) st.ghost.remove();
  gridEl.classList.remove('editing');
  if (st.target){
    st.target.classList.remove('drop');
    const toDock = st.target.dataset.area === 'dock';
    const ti = +st.target.dataset.idx;
    const fromDock = st.cell.dataset.area === 'dock';
    const fromArr = fromDock ? dockSlots : homeSlots;
    const toArr = toDock ? dockSlots : homeSlots;
    const t = toArr[ti];
    toArr[ti] = fromArr[st.idx];
    fromArr[st.idx] = t || null;
    persistDev();
  }
  renderHome();
}

/* ============ app-open animation + view switching ============ */
function appAnim(app, iconEl, after){
  const r = iconEl.getBoundingClientRect();
  const ov = document.createElement('div');
  ov.className = 'appanim';
  ov.innerHTML = `<div class="aa-ic">${appIconSVG(app)}</div>`;
  document.body.appendChild(ov);
  const ic = ov.querySelector('.aa-ic');
  const t = Math.max(0, r.top), rt = Math.max(0, innerWidth - r.right),
        b = Math.max(0, innerHeight - r.bottom), l = Math.max(0, r.left);
  ov.style.clipPath = `inset(${t}px ${rt}px ${b}px ${l}px round ${Math.min(18, r.width / 3)}px)`;
  const FIN = 118;
  const dx = (r.left + r.width / 2) - innerWidth / 2;
  const dy = (r.top + r.height / 2) - innerHeight / 2;
  ic.style.transform = `translate(${dx}px, ${dy}px) scale(${(r.width / FIN).toFixed(4)})`;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    ov.style.clipPath = 'inset(0px round 0px)';
    ic.style.transform = 'none';
  }));
  setTimeout(after, 790);
  setTimeout(() => ov.classList.add('fade'), 790);
  setTimeout(() => ov.remove(), 1180);
}
function openApp(app, iconEl){
  appAnim(app, iconEl, () => {
    showView(app.id);
    if (window.parent !== window){
      try {
        parent.postMessage({
          type: 'mumu-open', id: DEV && DEV.id,
          app: { id: app.id, name: app.name, icon: appIconSVG(app) }
        }, '*');
      } catch (e) {}
    }
  });
}

let chRoot = null, storeRoot = null, phEl = null, embedEl = null, embedUrl = null;
function showView(v){
  const home = v === 'home';
  $('#statusbar').classList.toggle('appbg', !home);
  gridEl.style.display = home ? '' : 'none';
  dockEl.style.display = home ? '' : 'none';
  gestEl.style.display = home ? '' : 'none';
  if (chRoot) chRoot.style.display = (v === 'chromium') ? '' : 'none';
  if (storeRoot) storeRoot.style.display = (v === 'store') ? '' : 'none';
  const app = appById(v);
  if (embedEl) embedEl.style.display = (app && app.url) ? '' : 'none';
  if (phEl) phEl.style.display = 'none';
  if (home){ avEl.hidden = true; return; }
  avEl.hidden = false;
  if (v === 'store'){
    if (!storeRoot) storeRoot = buildStore();
    if (storeRoot.parentElement !== avEl) avEl.appendChild(storeRoot);
    return;
  }
  if (v === 'chromium'){
    if (!chRoot){ chRoot = buildChromium(); avEl.appendChild(chRoot); renderCh(); }
    else {
      const tm = chRoot.querySelector('.ch-tabsmenu');
      if (tm) tm.remove();
      if (chRoot.parentElement !== avEl) avEl.appendChild(chRoot);
      chRoot.style.display = '';
      layoutTabs();
    }
    return;
  }
  if (app && app.url){
    if (!embedEl){
      embedEl = document.createElement('iframe');
      embedEl.className = 'appembed';
      avEl.appendChild(embedEl);
    }
    if (embedUrl !== app.url){ embedUrl = app.url; embedEl.src = app.url; }
    return;
  }
  if (!phEl){
    phEl = document.createElement('div');
    phEl.className = 'avbox';
    phEl.innerHTML = `<div class="avic"></div><div class="avname"></div><div class="avsub">Not available yet</div>`;
    avEl.appendChild(phEl);
  }
  phEl.style.display = '';
  if (app){
    phEl.querySelector('.avic').innerHTML = appIconSVG(app);
    phEl.querySelector('.avname').textContent = app.name;
  }
}
function destroyChromium(){
  if (chRoot){ chRoot.remove(); chRoot = null; }
  CH.tabs = [chTab()];
  CH.cur = 0;
  CH.marks = new Map();
  closedStack.length = 0;
}

addEventListener('message', e => {
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'mumu-view') showView(d.view === 'app' ? d.id : 'home');
  if (d.type === 'mumu-app-closed' && d.id === 'chromium') destroyChromium();
});

const CH = { tabs: [null], cur: 0, marks: new Map() };
const closedStack = [];           /* closed tabs for undo / ctrl+shift+t */
CH.tabs = [chTab()];
function chTab(){ return { hist: [{ type: 'newtab' }], idx: 0 }; }
function chCur(){ return CH.tabs[CH.cur]; }
function chEnt(){ const t = chCur(); return t.hist[t.idx]; }
function hostOf(u){ try { return new URL(u).hostname; } catch (e) { return u; } }
function entKey(e){ return e.type === 'newtab' ? 'newtab' : e.url; }
function entTitle(e){ return e.type === 'newtab' ? 'New Tab' : hostOf(e.url); }
function addrOf(e){ return e.type === 'newtab' ? 'www.google.com' : e.url.replace(/^https?:\/\//, ''); }
function entHost(e){ return e.type === 'newtab' ? 'google.com' : hostOf(e.url); }
function tabIcon(ent){
  return `<span class="ch-tic">${CH_GLOBE}<img class="ch-fav" src="${FAV(entHost(ent))}" alt="" onerror="this.remove()"></span>`;
}
function chGo(ent){
  const t = chCur();
  t.hist = t.hist.slice(0, t.idx + 1);
  t.hist.push(ent);
  t.idx++;
  renderCh();
}
function goFromText(txt){
  const t = txt.trim();
  if (!t) return;
  const hasProto = /^[a-z][a-z0-9+.-]*:\/\//i.test(t);
  const isUrl = hasProto || (!/\s/.test(t) && /^[\w-]+(\.[\w-]+)+([\/?#:].*)?$/i.test(t));
  if (isUrl) chGo({ type: 'web', url: hasProto ? t : 'https://' + t });
  else chGo({ type: 'web', url: 'https://www.google.com/search?q=' + encodeURIComponent(t) });
}
/* equal-width tabs sized so the strip (tabs + the adjacent + button) always fits */
function tabWidthFor(){
  const strip = chRoot.querySelector('.ch-strip');
  const n = Math.max(1, CH.tabs.length);
  const w = (strip.clientWidth - 64 - 12 * n) / n;
  return Math.round(Math.max(56, Math.min(240, w)));
}
function layoutTabs(oldW){
  if (!chRoot || !chRoot.isConnected || chRoot.style.display === 'none') return;
  const els = [...chRoot.querySelectorAll('.ch-tab')];
  if (!els.length) return;
  const w = tabWidthFor();
  const apply = () => {
    els.forEach(el => { el.style.width = w + 'px'; });
    els.forEach(el => {
      const nm = el.querySelector('.ch-tname');
      if (nm) nm.classList.toggle('ov', nm.scrollWidth > nm.clientWidth);
    });
  };
  if (oldW != null && Math.abs(oldW - w) > 1){
    els.forEach(el => { el.style.transition = 'none'; el.style.width = oldW + 'px'; });
    requestAnimationFrame(() => requestAnimationFrame(() => {
      els.forEach(el => { el.style.transition = 'width .3s cubic-bezier(.2,.8,.3,1)'; });
      apply();
    }));
  } else apply();
}
function flipPlus(old){
  if (!chRoot) return;
  const plus = chRoot.querySelector('.ch-new');
  if (!plus || !old) return;
  const dx = old.left - plus.getBoundingClientRect().left;
  if (Math.abs(dx) < 1) return;
  plus.style.transition = 'none';
  plus.style.transform = 'translateX(' + dx + 'px)';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    plus.style.transition = 'transform .32s cubic-bezier(.16,1,.3,1)';
    plus.style.transform = '';
    plus.addEventListener('transitionend', () => { plus.style.transition = ''; }, { once: true });
  }));
}
function chNewTab(){
  const plus = chRoot && chRoot.querySelector('.ch-new');
  const pr = plus && plus.getBoundingClientRect();
  CH.tabs.push(chTab());
  CH.cur = CH.tabs.length - 1;
  renderCh(true);
  flipPlus(pr);
}
function chCloseAt(i){
  if (CH.tabs.length === 1){
    closedStack.push({ tab: CH.tabs[0], idx: 0, title: entTitle(CH.tabs[0].hist[CH.tabs[0].idx]) });
    showSnack(closedStack[closedStack.length - 1].title);
    CH.tabs = [chTab()];
    CH.cur = 0;
  } else {
    const tb = CH.tabs[i];
    closedStack.push({ tab: tb, idx: i, title: entTitle(tb.hist[tb.idx]) });
    showSnack(closedStack[closedStack.length - 1].title);
    CH.tabs.splice(i, 1);
    if (i < CH.cur) CH.cur--;
    if (CH.cur >= CH.tabs.length) CH.cur = CH.tabs.length - 1;
  }
  renderCh();
}
function closeChTab(i){
  if (!chRoot) return;
  const el = chRoot.querySelectorAll('.ch-tab')[i];
  const plus = chRoot.querySelector('.ch-new');
  const pr = plus && plus.getBoundingClientRect();
  if (el){
    el.classList.add('out');
    setTimeout(() => { chCloseAt(i); flipPlus(pr); }, 190);
  } else chCloseAt(i);
}
function reopenClosedTab(){
  const c = closedStack.pop();
  if (!c || !chRoot) return;
  const plus = chRoot.querySelector('.ch-new');
  const pr = plus && plus.getBoundingClientRect();
  const at = Math.min(c.idx, CH.tabs.length);
  CH.tabs.splice(at, 0, c.tab);
  CH.cur = at;
  renderCh(true);
  flipPlus(pr);
  hideSnack();
}

/* ---- undo snackbar (slide-up from the bottom of the browser) ---- */
let snackTimer = null;
function showSnack(name){
  if (!chRoot) return;
  let s = chRoot.querySelector('.ch-snack');
  if (!s){
    s = document.createElement('div');
    s.className = 'ch-snack';
    s.innerHTML = `<span class="cs-txt"></span><button class="cs-undo">Undo</button>`;
    chRoot.appendChild(s);
    s.querySelector('.cs-undo').addEventListener('click', e => {
      e.stopPropagation();
      reopenClosedTab();
    });
    s.addEventListener('click', () => hideSnack());
    let sy = null;                                  /* swipe down to dismiss */
    s.addEventListener('pointerdown', e => { sy = e.clientY; });
    s.addEventListener('pointermove', e => {
      if (sy != null && e.clientY - sy > 30){ sy = null; hideSnack(); }
    });
    s.addEventListener('pointerup', () => { sy = null; });
    s.addEventListener('pointercancel', () => { sy = null; });
  }
  s.querySelector('.cs-txt').textContent = 'Closed ' + name;
  requestAnimationFrame(() => requestAnimationFrame(() => s.classList.add('show')));
  clearTimeout(snackTimer);
  snackTimer = setTimeout(hideSnack, 5000);
}
function hideSnack(){
  clearTimeout(snackTimer);
  if (!chRoot) return;
  const s = chRoot.querySelector('.ch-snack');
  if (s) s.classList.remove('show');
}

function buildChromium(){
  const root = document.createElement('div');
  root.className = 'chromium';
  root.innerHTML = `
    <div class="ch-strip">
      <div class="ch-tabs"></div>
      <button class="ch-new" aria-label="New tab">${CH_PLUS}</button>
    </div>

const DLS = {};
let matchIdx = {};

function matchGame(q, g){
  const n = g.name.toLowerCase();
  const s = q.trim().toLowerCase();
  if (!s) return { score: 4, idx: [], exact: false };
  if (n === s) return { score: -1, idx: [...n].map((_, i) => i), exact: true };
  if (n.startsWith(s)) return { score: 0, idx: [...s].map((_, i) => i), exact: false };
  const words = n.split(/\s+/);
  const wi = words.findIndex(w => w.startsWith(s));
  if (wi > -1){
    let off = 0;
    for (let i = 0; i < wi; i++) off += words[i].length + 1;
    return { score: 1, idx: [...s].map((_, i) => off + i), exact: false };
  }
  const i = n.indexOf(s);
  if (i > -1) return { score: 2, idx: [...s].map((_, k) => i + k), exact: false };
  const idx = [];
  let j = 0;
  for (let k = 0; k < n.length && j < s.length; k++) if (n[k] === s[j]) { idx.push(k); j++; }
  if (j === s.length) return { score: 3, idx, exact: false };
  return null;
}
function search(q){
  const scored = [];
  GAMES.forEach(g => {
    const m = matchGame(q, g);
    if (m) scored.push({ g, m });
  });
  scored.sort((a, b) => a.m.score - b.m.score || a.g.name.localeCompare(b.g.name));
  return scored;
}

function gameState(g){
  if (installed.some(a => a.id === g.id)) return 'installed';

function installGame(g){
  if (installed.some(a => a.id === g.id)) return;
  const app = { id: g.id, name: g.name, icon: g.icon, url: g.url };
  installed.push(app);
  const slot = homeSlots.findIndex(s => !s);
  if (slot > -1) homeSlots[slot] = app;
  persistDev();
  renderHome();
}
function cancelInstall(g){
  const d = DLS[g.id];

  clearInterval(d.timer);
  clearTimeout(d.timer);
  delete DLS[g.id];

function startInstall(g){
  if (gameState(g) !== 'idle') return;
  const d = DLS[g.id] = { phase: 'dl', pct: 0, timer: null };
  renderRow(g);
  d.timer = setInterval(() => {
    d.pct = Math.min(100, d.pct + 2 + Math.random() * 2.4);

    }
  }, 95);

  const down = st === 'dl' || st === 'inst';
  const btn = st === 'installed' ? '<button class="sr-btn play">Play</button>'
            : st === 'idle' ? '<button class="sr-btn install">Install</button>'
            : '<button class="sr-btn cancel">Cancel</button>';
  const pct = st === 'dl' ? `<span class="sr-dl">${Math.round(d.pct)}%</span>`
            : st === 'inst' ? '<span class="sr-dl">Installing</span>' : '';
  storeRoot.querySelectorAll(`.sr[data-g="${g.id}"]`).forEach(el => {
    el.classList.toggle('busy', down);
    el.classList.toggle('done', st === 'installed');
    const hl = el.dataset.hl === '1';
    el.innerHTML = `
      <span class="sr-icwrap${down ? ' down' : ''}">
        <img src="${g.icon}" alt="" draggable="false">${ringSVG(st, d)}
      </span>
      <span class="sr-info">
        <span class="sr-name">${hl ? nameHTML(g.name, matchIdx[g.id]) : `<span>${g.name}</span>`}</span>
        <span class="sr-rate">${ST_STAR}<span>${g.rating.toFixed(1)}</span>${g.cat ? `<span class="sr-cat">${catName(g.cat)}</span>` : ''}</span>
        ${pct}
      </span>
      ${btn}`;
  });
}
function renderDrop(drop, q){
  drop.innerHTML = '';
  matchIdx = {};
  const scored = search(q);
  scored.forEach(({ g, m }) => {
    matchIdx[g.id] = m.idx;
    const el = document.createElement('div');
    el.className = 'sr';
    el.dataset.g = g.id;
    el.dataset.hl = '1';
    drop.appendChild(el);
    renderRow(g);
  });
  if (!scored.length){
    const p = document.createElement('p');
    p.className = 'st-none';
    p.textContent = 'No results';
    drop.appendChild(p);
  }
}
function renderGrid(grid, q){
  grid.innerHTML = '';
  matchIdx = {};
  const scored = search(q);
  scored.forEach(({ g, m }) => {
    matchIdx[g.id] = m.idx;
    const el = document.createElement('div');
    el.className = 'sr' + (m.exact ? ' hero' : '');
    el.dataset.g = g.id;
    el.dataset.hl = '1';
    grid.appendChild(el);
    renderRow(g);
  });
  if (!scored.length){
    const p = document.createElement('p');
    p.className = 'st-none';
    p.textContent = 'No results';
    grid.appendChild(p);
  }
}
function wireSearch(view){
  const inp = view.querySelector('.st-search');
  const back = view.querySelector('.st-back');
  const drop = view.querySelector('.st-drop');
  const grid = view.querySelector('.st-grid');
  const cover = view.querySelector('.st-cover');
  const openSearch = () => {
    view.classList.add('searching');
    view.classList.remove('committed');
    storeRoot.classList.add('st-searching');
    renderDrop(drop, inp.value);
  };
  const closeSearch = () => {
    inp.value = '';
    inp.blur();
    view.classList.remove('searching', 'committed');
    storeRoot.classList.remove('st-searching');
    drop.innerHTML = '';
    grid.innerHTML = '';
  };
  inp.addEventListener('focus', () => {
    if (!view.classList.contains('searching') && !view.classList.contains('committed')) openSearch();
  });
  inp.addEventListener('input', () => {
    if (!view.classList.contains('searching')) openSearch();
    else renderDrop(drop, inp.value);
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter'){
      e.preventDefault();
      view.classList.remove('searching');
      view.classList.add('committed');
      storeRoot.classList.add('st-searching');
      renderGrid(grid, inp.value);
      inp.blur();
    }
  });
  back.addEventListener('click', closeSearch);
  cover.addEventListener('mousedown', closeSearch);
}

let curCat = 'all';
function buildStore(){
  const root = document.createElement('div');
  root.className = 'store';
  storeRoot = root;
  root.innerHTML = `
    <div class="st-head"><div class="st-ico">${appIconSVG(BASE[0])}</div></div>
    <div class="st-main">
      <nav class="st-tabs">
        <button class="st-tab sel" data-t="featured" role="tab"><span class="ti"></span><span>Featured</span></button>
        <button class="st-tab" data-t="category" role="tab"><span class="ti"></span><span>Category</span></button>
        <button class="st-tab" data-t="manage" role="tab"><span class="ti"></span><span>Manage Apps</span></button>
      </nav>
      <div class="st-div"></div>
      <div class="st-content">
        <div class="st-pane on" data-pane="featured">
          <div class="st-view">
            <h2 class="st-h">Suggested For You</h2>
            <div class="st-swrap">
              <button class="st-back" aria-label="Back">${ST_BACK}</button>
              <input class="st-search" placeholder="Search apps &amp; games" spellcheck="false" aria-label="Search apps">
            </div>
            <div class="st-cover"></div>
            <div class="st-drop"></div>
            <div class="st-grid"></div>
          </div>
        </div>
        <div class="st-pane" data-pane="category">
          <div class="st-view">
            <h2 class="st-h">Category</h2>
            <div class="st-swrap">
              <button class="st-back" aria-label="Back">${ST_BACK}</button>
              <input class="st-search" placeholder="Search apps &amp; games" spellcheck="false" aria-label="Search apps">
            </div>
            <div class="st-cover"></div>
            <div class="st-drop"></div>
            <div class="st-grid"></div>
            <div class="st-cats"></div>
            <div class="st-catgrid"></div>
          </div>
        </div>
        <div class="st-pane" data-pane="manage"><div class="st-soon">Coming soon</div></div>
      </div>
    </div>`;
  const setTab = t => {
    root.querySelectorAll('.st-tab').forEach(b => {
      const on = b.dataset.t === t;
      b.classList.toggle('sel', on);
      const ti = b.querySelector('.ti');
      if (b.dataset.t === 'featured') ti.innerHTML = stFeat(on);
      if (b.dataset.t === 'category') ti.innerHTML = stCatWrap(on);
      if (b.dataset.t === 'manage')   ti.innerHTML = stMan(on);
    });
    root.querySelectorAll('.st-pane').forEach(p => p.classList.toggle('on', p.dataset.pane === t));
  };
  root.querySelectorAll('.st-tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.t)));
  setTab('featured');

  root.querySelectorAll('.st-view').forEach(wireSearch);

  /* genre buttons + filtered game grid */
  const cats = root.querySelector('.st-cats');
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'st-catbtn' + (c.id === curCat ? ' sel' : '');
    b.dataset.cat = c.id;
    b.innerHTML = `${c.ic || ''}<span></span>`;
    b.querySelector('span').textContent = c.name;
    b.addEventListener('click', () => {
      curCat = c.id;
      root.querySelectorAll('.st-catbtn').forEach(x => x.classList.toggle('sel', x === b));
      renderCatGrid();
    });
    cats.appendChild(b);
  });
  renderCatGrid();

  root.addEventListener('click', e => {
    const btn = e.target.closest('.sr-btn');
    if (!btn) return;
    const row = btn.closest('.sr');
    const g = GAMES.find(x => x.id === row.dataset.g);
    if (!g) return;
    const st = gameState(g);
    if (st === 'idle') startInstall(g);
    else if (st === 'dl' || st === 'inst') cancelInstall(g);
    else {
      const app = installed.find(a => a.id === g.id);
      if (app) openApp(app, row.querySelector('.sr-icwrap'));
    }
  });
  return root;
}
function renderCatGrid(){
  if (!storeRoot) return;
  const cg = storeRoot.querySelector('.st-catgrid');
  cg.innerHTML = '';
  const list = curCat === 'all' ? GAMES : GAMES.filter(g => g.cat === curCat);
  list.forEach(g => {
    const el = document.createElement('div');
    el.className = 'sr';
    el.dataset.g = g.id;
    cg.appendChild(el);
    renderRow(g);
  });
  if (!list.length){
    const p = document.createElement('p');
    p.className = 'st-none';
    p.textContent = 'No games in this category yet';
    cg.appendChild(p);
  }
}

/* ============ clock ============ */
function tick(){
  const d = new Date();
  let h = d.getHours() % 12; if (h === 0) h = 12;
  $('#clock').textContent = h + ':' + String(d.getMinutes()).padStart(2, '0');
}
tick(); setInterval(tick, 5000);

/* ============ boot ============ */
(function bootProgress(){
  const line = $('.bb-line'), pct = $('.bb-pct');
  const T = 2600;
  const P = [[0,0],[340,12],[640,38],[780,40],[1240,66],[1380,68],[2000,94],[2280,100]];
  const t0 = performance.now();
  (function step(now){
    const t = now - t0;
    let v = 100;
    for (let i = 1; i < P.length; i++){
      if (t <= P[i][0]){
        const [ta, va] = P[i - 1], [tb, vb] = P[i];
        v = va + (vb - va) * (t - ta) / (tb - ta);
        break;
      }
      v = P[i][1];
    }
    line.style.width = v + '%';
    pct.textContent = Math.round(v) + '%';
    if (t < T - 40) requestAnimationFrame(step);
  })(t0);
})();
setTimeout(() => {
  $('#splash').classList.add('hide');
  $('#bootbar').classList.add('hide');
  uiEl.classList.add('ready');
  setTimeout(() => { $('#splash').remove(); $('#bootbar').remove(); }, 700);
}, 2600);

/* ============ init ============ */
draw();
setScale();
renderHome();
addEventListener('resize', () => {
  draw();
  setScale();
  if (chRoot && chRoot.isConnected && chRoot.style.display !== 'none') layoutTabs();
});
loadDevState(st => {
  if (st && Array.isArray(st.installed)){
    installed = st.installed.filter(d => d && d.id && d.url)
      .map(d => ({ id: String(d.id), name: String(d.name || 'App'), icon: String(d.icon || ''), url: String(d.url) }));
    if (Array.isArray(st.home))  homeSlots = st.home.slice(0, 18).map(deApp);
    if (Array.isArray(st.dock))  dockSlots = st.dock.slice(0, 4).map(deApp);
    while (homeSlots.length < 18) homeSlots.push(null);
    while (dockSlots.length < 4) dockSlots.push(null);
    renderHome();
  }
});

addEventListener('keydown', e => {
  /* chromium shortcuts (note: Chrome/Edge reserve Ctrl+T/N/W/Shift+T and may
     swallow them before the page sees the event — they work whenever the
     browser does deliver the keydown) */
  if (chRoot && chRoot.style.display !== 'none' && (e.ctrlKey || e.metaKey)){
    const k = e.key.toLowerCase();
    if (e.shiftKey && k === 't'){ e.preventDefault(); reopenClosedTab(); return; }
    if (!e.shiftKey && (k === 't' || k === 'n')){ e.preventDefault(); chNewTab(); return; }
    if (k === 'w'){ e.preventDefault(); closeChTab(CH.cur); return; }
  }
  if (e.key !== 'Escape') return;
  if (chRoot){
    const dlg = chRoot.querySelector('.ch-dlg');
    if (dlg){ dlg.remove(); return; }
    const pop = chRoot.querySelector('.tm-popwrap');
    if (pop){ pop.remove(); return; }
    const tm = chRoot.querySelector('.ch-tabsmenu');
    if (tm){ tm.remove(); return; }
    const snack = chRoot.querySelector('.ch-snack.show');
    if (snack){ hideSnack(); return; }
  }
  if (window.parent !== window && DEV && DEV.id != null){
    parent.postMessage({ type: 'mumu-close', id: DEV.id }, '*');
  }
});
})();
</script>
