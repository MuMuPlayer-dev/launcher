<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUMUPlayer</title>
<link rel="icon" href="https://images.dwncdn.net/images/t_app-icon-l/p/d520014e-daf4-451a-8a8c-9aacc33f4d25/2693453914/mumuplayer-1-logo">
<style>
:root{--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#060a17;color:#fff;cursor:default;font-family:'Segoe UI','Segoe UI Variable Text',system-ui,-apple-system,Arial,sans-serif;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus{outline:none}
button:focus-visible{outline:2px solid rgba(255,255,255,.5);outline-offset:3px;border-radius:14px}

/* wallpaper canvas sits behind everything */
#wall{position:fixed;inset:0;z-index:0;display:block}

/* home UI — hidden until the boot splash finishes */
#ui{position:fixed;inset:0;z-index:1;opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
#ui.ready{opacity:1;transform:none}

#statusbar{position:absolute;top:0;left:0;right:0;height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.sb-right{display:flex;align-items:center;gap:10px}
.sb-right svg{display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45))}

/* 6 × 3 home grid */
#appgrid{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:grid;grid-template-columns:repeat(6,92px);grid-template-rows:repeat(3,104px)}
.app{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.app .ic{width:56px;height:56px;transition:transform .16s var(--ease)}
.app .ic svg{width:100%;height:100%;display:block}
.app:active .ic{transform:scale(.86)}
.app .lb{font-size:12px;font-weight:500;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);max-width:88px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* dock — 4 apps, no labels */
#dock{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;gap:14px;padding:11px 15px;border-radius:28px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(18px) saturate(1.25)}
#dock .app{gap:0}
#dock .app .ic{width:52px;height:52px}
#dock .app .lb{display:none}

/* gesture pill */
#gest{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);width:118px;height:4px;border-radius:99px;background:rgba(255,255,255,.55)}

/* boot splash — logo + text over a blurred panel that sits above the wallpaper */
#splash{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;transition:opacity .65s ease}
#splash.hide{opacity:0;pointer-events:none}
.spl-card{display:flex;flex-direction:column;align-items:center;gap:22px;padding:54px 88px;border-radius:30px;background:rgba(6,11,25,.38);border:1px solid rgba(255,255,255,.07);backdrop-filter:blur(16px) saturate(1.15);animation:splIn .8s var(--ease) both}
@keyframes splIn{from{opacity:0;transform:scale(.93) translateY(12px)}}
.spl-logo{width:98px;height:98px;border-radius:24px;display:block;user-select:none;-webkit-user-drag:none}
.spl-name{font-size:46px;font-weight:600;letter-spacing:.015em;color:#fff;text-shadow:0 2px 18px rgba(90,150,220,.35)}
</style>
</head>
<body>
<canvas id="wall"></canvas>

<div id="ui">
  <div id="statusbar">
    <span id="clock">9:41</span>
    <span class="sb-right">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
        <path d="M2.5 9a15 15 0 0 1 19 0"/>
        <path d="M5.5 12.5a10.5 10.5 0 0 1 13 0"/>
        <path d="M8.5 16a6 6 0 0 1 7 0"/>
        <circle cx="12" cy="19.6" r="1.4" fill="#fff" stroke="none"/>
      </svg>
      <svg width="23" height="17" viewBox="0 0 28 18" aria-hidden="true">
        <rect x="1" y="3" width="22" height="12" rx="3" fill="none" stroke="#fff" stroke-width="1.8" opacity=".9"/>
        <rect x="24.2" y="7" width="2.8" height="4" rx="1" fill="#fff" opacity=".9"/>
        <rect x="3.6" y="5.6" width="14" height="6.8" rx="1.6" fill="#fff"/>
      </svg>
    </span>
  </div>
  <div id="appgrid"></div>
  <div id="dock"></div>
  <div id="gest"></div>
</div>

<div id="splash">
  <div class="spl-card">
    <img class="spl-logo" alt="MUMUPlayer" draggable="false"
         src="https://images.dwncdn.net/images/t_app-icon-l/p/d520014e-daf4-451a-8a8c-9aacc33f4d25/2693453914/mumuplayer-1-logo">
    <div class="spl-name">MUMUPlayer</div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);

/* device info passed from the launcher through the URL hash */
let DEV = null;
try { DEV = JSON.parse(decodeURIComponent(location.hash.slice(1)) || 'null'); } catch (e) {}
if (DEV && DEV.name) document.title = DEV.name + ' — MUMUPlayer';

/* ============ wallpaper (drawn on a canvas, fully deterministic) ============ */
const cv = $('#wall'), cx = cv.getContext('2d');

/* mulberry32 — seeded PRNG so the sky is identical on every boot */
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/* star: white core with a blue glow around it */
function star(x, y, s, a){
  const g = cx.createRadialGradient(x, y, 0, x, y, s * 4.5);
  g.addColorStop(0, 'rgba(165,195,255,' + (0.55 * a).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(120,160,255,0)');
  cx.fillStyle = g; cx.beginPath(); cx.arc(x, y, s * 4.5, 0, 7); cx.fill();
  cx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
  cx.beginPath(); cx.arc(x, y, s, 0, 7); cx.fill();
}
/* crater: shaded bowl — lit inner wall toward (lx,ly), dark rim on the far side */
function crater(x, y, r, lx, ly, dark, mid, rim){
  const la = Math.atan2(ly, lx);
  const g = cx.createRadialGradient(x + lx * r * 0.45, y + ly * r * 0.45, r * 0.1, x, y, r);
  g.addColorStop(0, rim); g.addColorStop(.6, mid); g.addColorStop(1, dark);
  cx.fillStyle = g;
  cx.beginPath(); cx.ellipse(x, y, r, r * 0.94, 0, 0, 7); cx.fill();
  cx.lineWidth = Math.max(1, r * 0.16);
  cx.strokeStyle = 'rgba(255,255,255,.30)';
  cx.beginPath(); cx.arc(x, y, r * 0.9, la - 0.85, la + 0.85); cx.stroke();
  cx.strokeStyle = 'rgba(0,0,25,.22)';
  cx.beginPath(); cx.arc(x, y, r * 0.9, la + Math.PI - 0.85, la + Math.PI + 0.85); cx.stroke();
}
function rr(x, y, w, h, r){
  cx.beginPath();
  cx.moveTo(x + r, y);
  cx.arcTo(x + w, y, x + w, y + h, r);
  cx.arcTo(x + w, y + h, x, y + h, r);
  cx.arcTo(x, y + h, x, y, r);
  cx.arcTo(x, y, x + w, y, r);
  cx.closePath();
}

const ROT = 15 * Math.PI / 180;   /* pills rotated 15° clockwise */

function draw(){
  const dpr = window.devicePixelRatio || 1;
  const W = innerWidth, H = innerHeight, m = Math.min(W, H);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const rnd = mulberry32(0x4D554D21);   /* fixed seed — same sky every load */

  /* dark blue space background */
  const bg = cx.createLinearGradient(0, 0, W * 0.25, H);
  bg.addColorStop(0, '#0b1326'); bg.addColorStop(.55, '#091021'); bg.addColorStop(1, '#060a17');
  cx.fillStyle = bg; cx.fillRect(0, 0, W, H);

  /* star field — small, varying sizes, blue glow */
  const n = Math.max(60, Math.round(W * H / 9000));
  for (let i = 0; i < n; i++){
    star(rnd() * W, rnd() * H, 0.4 + rnd() * rnd() * 1.9, 0.55 + rnd() * 0.45);
  }

  /* ---- bottom-left moon: only its top-right is visible ---- */
  const mr = m * 0.52, mcx = -mr * 0.34, mcy = H + mr * 0.34;
  cx.save();
  cx.beginPath(); cx.arc(mcx, mcy, mr, 0, 7); cx.clip();
  const mg = cx.createRadialGradient(mcx + mr * 0.55, mcy - mr * 0.55, mr * 0.1, mcx, mcy, mr);
  mg.addColorStop(0, '#eff1f3'); mg.addColorStop(.55, '#d5d9dd'); mg.addColorStop(1, '#b7bdc3');
  cx.fillStyle = mg; cx.fillRect(mcx - mr, mcy - mr, mr * 2, mr * 2);
  for (let i = 0; i < 9; i++){                      /* shaded craters on the lit side */
    const ang = -(0.3 + rnd() * 1.05), d = mr * (0.28 + rnd() * 0.55);
    crater(mcx + Math.cos(ang) * d, mcy + Math.sin(ang) * d,
           mr * (0.04 + rnd() * 0.085), 0.7, -0.7, '#787e86', '#a6abb1', '#dfe2e5');
  }
  /* very dark blue gradient around the circle's bottom-left (night side) */
  const term = cx.createLinearGradient(mcx - mr * 0.8, mcy + mr * 0.8, mcx + mr * 0.6, mcy - mr * 0.6);
  term.addColorStop(0, 'rgba(4,7,20,0.97)'); term.addColorStop(.5, 'rgba(5,9,26,0.55)'); term.addColorStop(1, 'rgba(5,9,26,0)');
  cx.fillStyle = term; cx.fillRect(mcx - mr, mcy - mr, mr * 2, mr * 2);
  cx.restore();
  cx.strokeStyle = 'rgba(255,255,255,.35)'; cx.lineWidth = 2.5;   /* rim light on the lit edge */
  cx.beginPath(); cx.arc(mcx, mcy, mr - 1.2, -0.785 - 0.65, -0.785 + 0.65); cx.stroke();

  /* ---- two glowing pills + aligned circle on the right ---- */
  const PW = m * 0.085, PL = m * 0.36;
  const pA = { x: W * 0.66,                 y: H * 0.36 };
  const pB = { x: W * 0.66 + PW * 1.95,     y: H * 0.36 };
  /* circle: same size as a pill's end, centered at the pills' bottom-end y level */
  const circ = { x: pB.x + PW * 1.5, y: H * 0.36 + Math.cos(ROT) * PL / 2 };

  function glowingShape(kind, px, py){
    cx.save();
    cx.translate(px, py);
    if (kind === 'pill') cx.rotate(ROT);
    const R = kind === 'pill' ? PL / 2 : PW / 2;
    const grad = cx.createRadialGradient(0, 0, R * 0.08, 0, 0, R);
    grad.addColorStop(0, '#8ed2f3');    /* light sky blue center */
    grad.addColorStop(.35, '#c4e4f7');
    grad.addColorStop(1, '#eff8ff');    /* very light blue edges */
    const path = () => {
      if (kind === 'pill') rr(-PW / 2, -PL / 2, PW, PL, PW / 2);   /* circular ends */
      else { cx.beginPath(); cx.arc(0, 0, PW / 2, 0, 7); }
    };
    cx.shadowColor = 'rgba(125,190,255,.38)';    /* wide glow trailing to the left */
    cx.shadowBlur = 64; cx.shadowOffsetX = -54;
    cx.fillStyle = grad; path(); cx.fill();
    cx.shadowColor = 'rgba(150,212,255,.62)';    /* tighter glow hugging the left */
    cx.shadowBlur = 26; cx.shadowOffsetX = -20;
    path(); cx.fill();
    cx.shadowColor = 'transparent'; cx.shadowBlur = 0; cx.shadowOffsetX = 0;
    cx.fillStyle = grad; path(); cx.fill();
    cx.strokeStyle = 'rgba(255,255,255,.5)'; cx.lineWidth = 1;
    path(); cx.stroke();
    cx.restore();
  }
  glowingShape('pill',   pA.x,   pA.y);
  glowingShape('pill',   pB.x,   pB.y);
  glowingShape('circle', circ.x, circ.y);

  /* ---- top-right planet: greyish cyan, shadowed from the top right ---- */
  const pr = m * 0.17, pcx = W - pr * 1.3, pcy = pr * 1.5;
  cx.save();
  cx.beginPath(); cx.arc(pcx, pcy, pr, 0, 7); cx.clip();
  const pg = cx.createRadialGradient(pcx - pr * 0.5, pcy + pr * 0.5, pr * 0.15, pcx, pcy, pr * 1.05);
  pg.addColorStop(0, '#c8dbdf'); pg.addColorStop(.6, '#a9c4cb'); pg.addColorStop(1, '#8fb0b9');
  cx.fillStyle = pg; cx.fillRect(pcx - pr, pcy - pr, pr * 2, pr * 2);
  const sh = cx.createLinearGradient(pcx + pr * 0.85, pcy - pr * 0.85, pcx - pr * 0.7, pcy + pr * 0.7);
  sh.addColorStop(0, 'rgba(23,62,74,0.85)'); sh.addColorStop(.55, 'rgba(23,62,74,0.35)'); sh.addColorStop(1, 'rgba(23,62,74,0)');
  cx.fillStyle = sh; cx.fillRect(pcx - pr, pcy - pr, pr * 2, pr * 2);
  for (let i = 0; i < 8; i++){                      /* darker spots, lit from bottom-left */
    const a = rnd() * Math.PI * 2, d = rnd() * pr * 0.72;
    crater(pcx + Math.cos(a) * d, pcy + Math.sin(a) * d,
           pr * (0.05 + rnd() * 0.08), -0.7, 0.7, '#5d7b85', '#89a4ac', '#d3e6ea');
  }
  cx.restore();
  cx.strokeStyle = 'rgba(225,248,252,.5)'; cx.lineWidth = 1.6;
  cx.beginPath(); cx.arc(pcx, pcy, pr - 0.8, Math.PI * 0.6, Math.PI * 1.1); cx.stroke();

  /* a handful of stars above that planet */
  const topBand = Math.max(8, (pcy - pr) - 18);
  for (let i = 0; i < 5; i++){
    star(pcx - pr * 1.05 + rnd() * pr * 2.1, 10 + rnd() * topBand, 0.7 + rnd() * 1.1, 0.9);
  }
}
draw();
let rzT; addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(draw, 120); });

/* ============ apps (6 defaults — 2 on home, 4 in the dock) ============ */
function tint(hex, f){
  const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  const c = v => Math.round(f > 0 ? v + (255 - v) * f : v * (1 + f));
  return 'rgb(' + c(r) + ',' + c(g) + ',' + c(b) + ')';
}
const HOME_APPS = [
  { id: 'store',   name: 'MuMu Store', hue: '#2e86c8', letter: 'M' },
  { id: 'cloner',  name: 'App Cloner', hue: '#cf7a3c', letter: 'A' }
];
const DOCK_APPS = [
  { id: 'settings', name: 'Settings', hue: '#76818d', letter: 'S' },
  { id: 'gallery',  name: 'Gallery',  hue: '#8a5fc0', letter: 'G' },
  { id: 'files',    name: 'Files',    hue: '#4c9d6e', letter: 'F' },
  { id: 'chromium', name: 'Chromium', hue: '#47a1dd', letter: 'C' }
];
function iconSVG(a){   /* placeholder icons — replaced later */
  return `<svg viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <linearGradient id="ig-${a.id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${tint(a.hue, .22)}"/>
        <stop offset="1" stop-color="${a.hue}"/>
      </linearGradient>
    </defs>
    <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#ig-${a.id})"/>
    <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="rgba(255,255,255,.18)"/>
    <text x="32" y="41.5" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="27" font-weight="700" fill="#fff">${a.letter}</text>
  </svg>`;
}
function appEl(a){
  const b = document.createElement('button');
  b.className = 'app';
  b.setAttribute('aria-label', a.name);
  b.innerHTML = `<span class="ic">${iconSVG(a)}</span><span class="lb"></span>`;
  b.querySelector('.lb').textContent = a.name;
  return b;
}
const grid = $('#appgrid');
HOME_APPS.forEach(a => grid.appendChild(appEl(a)));   /* slots 1 & 2 of the 6×3 grid */
DOCK_APPS.forEach(a => $('#dock').appendChild(appEl(a)));

/* ============ clock ============ */
function tick(){
  const d = new Date();
  let h = d.getHours() % 12; if (h === 0) h = 12;
  $('#clock').textContent = h + ':' + String(d.getMinutes()).padStart(2, '0');
}
tick(); setInterval(tick, 5000);

/* ============ boot splash ============ */
setTimeout(() => {
  const sp = $('#splash');
  sp.classList.add('hide');
  $('#ui').classList.add('ready');
  setTimeout(() => sp.remove(), 700);
}, 2600);
})();
</script>
</body>
</html>
